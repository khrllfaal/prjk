; This API has no upload endpoint and never needs one — disabling file
; uploads entirely closes off one of the most common PHP RCE vectors
; (a core/extension bug reachable only through multipart upload parsing)
; without touching any app code. Hostinger (and most shared hosts) read
; .user.ini per-directory under PHP-FPM, no server restart needed — it
; takes effect on the next request.
file_uploads = Off

; Defense in depth alongside the absence of exec()/shell_exec()/eval()
; in this codebase (see helpers.php) — if a future bug or a compromised
; dependency ever tried to shell out, these being disabled at the PHP
; level stops it even then. Harmless here since nothing in this app
; calls them.
disable_functions = exec,passthru,shell_exec,system,proc_open,popen
