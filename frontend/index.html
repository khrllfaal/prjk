  /* ---------------- BUKU BESAR ---------------- */
  PAGES.buku_besar=function(c){
    var akunList=[];
    var seen={};
    allEntries().forEach(function(e){
      var a=akunLabel(e.akun);
      if(!seen[a]){ seen[a]=1; akunList.push(a); }
    });
    // sort by account code numerically; unlabelled entries go last
    akunList.sort(function(a,b){
      var ka=akunKode(a), kb=akunKode(b);
      if(!ka && !kb) return a<b?-1:1;
      if(!ka) return 1;
      if(!kb) return -1;
      var pa=ka.split('.').map(Number), pb=kb.split('.').map(Number);
      for(var i=0;i<Math.max(pa.length,pb.length);i++){
        var x=pa[i]||0, y=pb[i]||0;
        if(x!==y) return x-y;
      }
      return 0;
    });

    reportShell(c,'Buku Besar','Rincian mutasi dan saldo berjalan per akun',
      '<div class="field grow"><label>Pilih Akun</label><select id="fAkun">'+
      akunList.map(function(a,i){ return '<option'+(i===0?' selected':'')+'>'+esc(a)+'</option>'; }).join('')+'</select></div>');

    var tbl;
    function refresh(){
      var from=fv('fFrom'), to=fv('fTo'), akun=fv('fAkun');
      var all=allEntries().filter(function(e){ return akunLabel(e.akun)===akun; });
      var awal=0;
      all.forEach(function(e){ if(from && e.tgl<from) awal+=e.debet-e.kredit; });
      var rows=all.filter(function(e){ return inRange(e.tgl,from,to); })
        .sort(function(a,b){ return a.tgl>b.tgl?1:-1; });
      var run=awal;
      rows.forEach(function(r){ run+=r.debet-r.kredit; r._saldo=run; });

      var totD=rows.reduce(function(a,b){return a+b.debet;},0);
      var totK=rows.reduce(function(a,b){return a+b.kredit;},0);

      document.getElementById('reportBody').innerHTML=
        '<div class="kpi-grid" style="margin-bottom:14px;">'+
          kpiCard('Saldo Awal',rp(awal),from?('Sebelum '+fmtDate(from)):'Awal periode data','accent')+
          kpiCard('Total Debet',rp(totD),rows.length+' transaksi','accent')+
          kpiCard('Total Kredit',rp(totK),rows.length+' transaksi','accent')+
          kpiCard('Saldo Akhir',rp(run),'Setelah mutasi',run<0?'danger':'safe')+
        '</div><div class="panel"><div class="toolbar">'+
        '<div class="search-box"><span class="ic">⌕</span><input type="text" id="q" placeholder="Cari keterangan…"></div>'+
        '<span class="result-count" id="cnt"></span></div><div id="tbl"></div></div>';

      tbl=DataTable('tbl',[
        {key:'tgl',label:'Tanggal',render:function(r){ return fmtDate(r.tgl); }},
        {key:'ref',label:'Ref',render:function(r){ return '<span class="mono" style="font-size:11.5px;">'+esc(r.ref)+'</span>'; }},
        {key:'ket',label:'Keterangan',cls:'wrap',render:function(r){ return esc(r.ket||'–'); }},
        {key:'project',label:'Project',render:function(r){ return esc(r.project||'–'); }},
        {key:'debet',label:'Debet',num:true,render:function(r){ return r.debet?num0(r.debet):'<span class="faint-italic">–</span>'; },
         foot:function(l){ return '<b>'+num0(l.reduce(function(a,b){return a+b.debet;},0))+'</b>'; }},
        {key:'kredit',label:'Kredit',num:true,render:function(r){ return r.kredit?num0(r.kredit):'<span class="faint-italic">–</span>'; },
         foot:function(l){ return '<b>'+num0(l.reduce(function(a,b){return a+b.kredit;},0))+'</b>'; }},
        {key:'_saldo',label:'Saldo',num:true,sort:false,render:function(r){
          return '<b class="'+(r._saldo<0?'neg':'')+'">'+numSigned(r._saldo)+'</b>'; }}
      ], rows, {defaultSort:'tgl',defaultDir:'asc',perPage:20,showFoot:true,countId:'cnt',
        searchFn:function(r){ return [r.ket,r.project,r.ref].join(' '); },
        emptyText:'Tidak ada mutasi pada akun & rentang ini.'});
      bindSearch('q',tbl);
    }
    refresh(); bindReportFilter(refresh,['fAkun']);
    document.getElementById('fAkun').addEventListener('change',refresh);
    bindExport('exp','Buku_Besar',['Tanggal','Ref','Keterangan','Project','Debet','Kredit','Saldo'],
      function(){ return tbl.getFiltered().map(function(r){ return [r.tgl,r.ref,r.ket,r.project,r.debet,r.kredit,r._saldo]; }); });
  };

  /* ---------------- TRIAL BALANCE ---------------- */
  PAGES.trial=function(c){
    reportShell(c,'Trial Balance','Neraca saldo seluruh akun — total debet harus sama dengan total kredit');
    var tbl;
    function refresh(){
      var from=fv('fFrom'), to=fv('fTo');
      var map={};
      allEntries().forEach(function(e){
        if(!inRange(e.tgl,from,to)) return;
        var a=akunLabel(e.akun);
        if(!map[a]) map[a]={akun:a,kode:akunKode(e.akun),debet:0,kredit:0};
        map[a].debet+=e.debet; map[a].kredit+=e.kredit;
      });
      var rows=Object.keys(map).map(function(k){
        var r=map[k]; r.saldo=r.debet-r.kredit; return r;
      }).sort(function(a,b){ return (a.kode||'zz')>(b.kode||'zz')?1:-1; });

      var tD=rows.reduce(function(a,b){return a+b.debet;},0);
      var tK=rows.reduce(function(a,b){return a+b.kredit;},0);
      var balanced=Math.abs(tD-tK)<1;

      document.getElementById('reportBody').innerHTML=
        (balanced?'':alertHTML('warn','⚠','Trial balance belum seimbang',
          'Selisih debet–kredit sebesar <b>'+rp(Math.abs(tD-tK))+'</b>. Ini biasanya berarti ada transaksi yang lawan akunnya belum dicatat di data sumber.'))+
        '<div class="kpi-grid" style="margin-bottom:14px;">'+
          kpiCard('Total Debet',rp(tD),rows.length+' akun','accent')+
          kpiCard('Total Kredit',rp(tK),rows.length+' akun','accent')+
          kpiCard('Selisih',rp(Math.abs(tD-tK)),balanced?'Seimbang':'Tidak seimbang',balanced?'safe':'danger')+
        '</div><div class="panel"><div class="toolbar">'+
        '<div class="search-box"><span class="ic">⌕</span><input type="text" id="q" placeholder="Cari akun…"></div>'+
        '<span class="result-count" id="cnt"></span></div><div id="tbl"></div></div>';

      tbl=DataTable('tbl',[
        {key:'akun',label:'Nama Akun',cls:'wrap',render:function(r){ return esc(r.akun); }},
        {key:'debet',label:'Debet',num:true,render:function(r){ return num0(r.debet); },
         foot:function(l){ return '<b>'+num0(l.reduce(function(a,b){return a+b.debet;},0))+'</b>'; }},
        {key:'kredit',label:'Kredit',num:true,render:function(r){ return num0(r.kredit); },
         foot:function(l){ return '<b>'+num0(l.reduce(function(a,b){return a+b.kredit;},0))+'</b>'; }},
        {key:'saldo',label:'Saldo',num:true,render:function(r){
          return '<b class="'+(r.saldo<0?'neg':'')+'">'+numSigned(r.saldo)+'</b>'; },
         foot:function(l){ return '<b>'+numSigned(l.reduce(function(a,b){return a+b.saldo;},0))+'</b>'; }}
      ], rows, {defaultSort:null,perPage:25,showFoot:true,countId:'cnt',
        searchFn:function(r){ return r.akun; }, emptyText:'Tidak ada data pada rentang ini.'});
      bindSearch('q',tbl);
    }
    refresh(); bindReportFilter(refresh);
    bindExport('exp','Trial_Balance',['Nama Akun','Debet','Kredit','Saldo'],
      function(){ return tbl.getFiltered().map(function(r){ return [r.akun,r.debet,r.kredit,r.saldo]; }); });
  };

  /* ---------------- grouped statement helper ---------------- */
  function groupByHead(from,to,heads){
    var map={};
    allEntries().forEach(function(e){
      if(!inRange(e.tgl,from,to)) return;
      var h=akunHead(e.akun);
      if(heads.indexOf(h)===-1) return;
      var a=akunLabel(e.akun);
      if(!map[a]) map[a]={akun:a,kode:akunKode(e.akun),head:h,debet:0,kredit:0};
      map[a].debet+=e.debet; map[a].kredit+=e.kredit;
    });
    return Object.keys(map).map(function(k){ return map[k]; })
      .sort(function(a,b){ return (a.kode||'zz')>(b.kode||'zz')?1:-1; });
  }
  function headName(h){
    var a=DB.coa.find(function(x){ return x.kode===h; });
    return a?a.nama:('Kelompok '+h);
  }
  function statementTable(mountId, groups, valueFn){
    /* groups: [{head, label, sign}] */
    var html='<div class="table-scroll"><table class="dtab"><thead><tr>'+
      '<th class="nosort">Akun</th><th class="nosort num">Jumlah</th></tr></thead><tbody>';
    var grand=0;
    groups.forEach(function(g){
      html+='<tr class="row-group"><td>'+esc(g.label)+'</td><td class="num">'+
        (g.rows.length?num0(g.total):'–')+'</td></tr>';
      if(!g.rows.length){
        html+='<tr><td colspan="2" style="color:var(--text-faint);font-style:italic;">Tidak ada transaksi pada kelompok ini.</td></tr>';
      }
      g.rows.forEach(function(r){
        html+='<tr><td style="padding-left:28px;" class="wrap">'+esc(r.akun)+'</td>'+
          '<td class="num">'+numSigned(valueFn(r))+'</td></tr>';
      });
      grand+=g.total;
    });
    html+='</tbody></table></div>';
    document.getElementById(mountId).innerHTML=html;
    return grand;
  }

  /* ---------------- LABA RUGI ---------------- */
  PAGES.laba_rugi=function(c){
    reportShell(c,'Laba Rugi','Pendapatan dikurangi harga pokok, biaya usaha, dan biaya lain-lain');
    function refresh(){
      var from=fv('fFrom'), to=fv('fTo');
      /* One convention for every group: val = kredit − debet.
         Revenue accounts carry a credit balance so they come out positive; cost accounts carry a
         debit balance so they come out negative and therefore subtract when the subtotals are added. */
      var mk=function(heads){
        var rows=groupByHead(from,to,heads).map(function(r){
          return {akun:r.akun, val:r.kredit-r.debet};
        }).filter(function(r){ return Math.abs(r.val)>0.5; });
        return {rows:rows, total:rows.reduce(function(a,b){ return a+b.val; },0)};
      };
      var pend=mk(['4']), hpp=mk(['5']), biaya=mk(['6']), lain=mk(['7']), pajak=mk(['8']);
      var labaKotor=pend.total+hpp.total;
      var labaUsaha=labaKotor+biaya.total;
      var labaBersih=labaUsaha+lain.total+pajak.total;

      document.getElementById('reportBody').innerHTML=
        '<div class="kpi-grid" style="margin-bottom:14px;">'+
          kpiCard('Pendapatan',rp(pend.total),'Akun 4.x','accent')+
          kpiCard('Laba Kotor',rp(labaKotor),'Pendapatan − HPP','accent')+
          kpiCard('Laba Usaha',rp(labaUsaha),'Setelah biaya usaha','accent')+
          kpiCard('Laba Bersih',rp(labaBersih),labaBersih<0?'Rugi berjalan':'Laba berjalan',labaBersih<0?'danger':'safe')+
        '</div><div class="panel"><h3>Rincian Laba Rugi</h3>'+
        '<div class="panel-desc">Nilai negatif berarti mengurangi laba</div><div id="lrTable"></div></div>';

      statementTable('lrTable',[
        {label:'PENDAPATAN', rows:pend.rows, total:pend.total},
        {label:'HARGA POKOK PENJUALAN', rows:hpp.rows, total:hpp.total},
        {label:'BIAYA USAHA', rows:biaya.rows, total:biaya.total},
        {label:'PENDAPATAN & BIAYA LAIN-LAIN', rows:lain.rows, total:lain.total},
        {label:'PAJAK PENGHASILAN', rows:pajak.rows, total:pajak.total}
      ], function(r){ return r.val; });

      var t=document.querySelector('#lrTable table');
      if(t){
        var tf=document.createElement('tfoot');
        tf.innerHTML='<tr><td>LABA / RUGI BERSIH</td><td class="num" style="color:'+
          (labaBersih<0?'var(--danger)':'var(--safe)')+'">'+numSigned(labaBersih)+'</td></tr>';
        t.appendChild(tf);
      }
    }
    refresh(); bindReportFilter(refresh);
    bindExport('exp','Laba_Rugi',['Keterangan','Jumlah'],function(){
      var out=[]; document.querySelectorAll('#lrTable tr').forEach(function(tr){
        var td=tr.querySelectorAll('td');
        if(td.length===2) out.push([td[0].textContent.trim(), td[1].textContent.trim()]);
      });
      return out;
    });
  };

  /* ---------------- NERACA ---------------- */
  PAGES.neraca=function(c){
    reportShell(c,'Neraca','Posisi aktiva, kewajiban, dan ekuitas');
    function refresh(){
      var from=fv('fFrom'), to=fv('fTo');
      var mk=function(heads,sign){
        var rows=groupByHead(from,to,heads).map(function(r){
          return {akun:r.akun, val:sign*(r.debet-r.kredit)};
        }).filter(function(r){ return Math.abs(r.val)>0.5; });
        return {rows:rows, total:rows.reduce(function(a,b){ return a+b.val; },0)};
      };
      var aktiva=mk(['1'],1), kewajiban=mk(['2'],-1), ekuitas=mk(['3'],-1);
      var labaRows=groupByHead(from,to,['4','5','6','7','8']);
      var labaBerjalan=labaRows.reduce(function(a,b){ return a+(b.kredit-b.debet); },0);
      var totalPasiva=kewajiban.total+ekuitas.total+labaBerjalan;
      var selisih=aktiva.total-totalPasiva;

      document.getElementById('reportBody').innerHTML=
        (Math.abs(selisih)<1?'':alertHTML('warn','⚠','Neraca belum seimbang',
          'Selisih aktiva dan pasiva sebesar <b>'+rp(Math.abs(selisih))+'</b>. Umumnya karena saldo awal neraca belum diinput di data sumber — sheet transaksi hanya memuat mutasi Januari–April 2026.'))+
        '<div class="kpi-grid" style="margin-bottom:14px;">'+
          kpiCard('Total Aktiva',rp(aktiva.total),'Akun 1.x','accent')+
          kpiCard('Total Kewajiban',rp(kewajiban.total),'Akun 2.x','accent')+
          kpiCard('Ekuitas + Laba Berjalan',rp(ekuitas.total+labaBerjalan),'Akun 3.x + hasil usaha','accent')+
        '</div><div class="grid-2">'+
          '<div class="panel"><h3>AKTIVA</h3><div class="panel-desc">Harta perusahaan</div><div id="nAktiva"></div></div>'+
          '<div class="panel"><h3>PASIVA</h3><div class="panel-desc">Kewajiban &amp; ekuitas</div><div id="nPasiva"></div></div>'+
        '</div>';

      statementTable('nAktiva',[{label:'AKTIVA',rows:aktiva.rows,total:aktiva.total}],function(r){ return r.val; });
      statementTable('nPasiva',[
        {label:'KEWAJIBAN',rows:kewajiban.rows,total:kewajiban.total},
        {label:'EKUITAS',rows:ekuitas.rows.concat([{akun:'Laba / Rugi Berjalan',val:labaBerjalan}]),
         total:ekuitas.total+labaBerjalan}
      ],function(r){ return r.val; });
    }
    refresh(); bindReportFilter(refresh);
    bindExport('exp','Neraca',['Keterangan','Jumlah'],function(){
      var out=[]; document.querySelectorAll('#nAktiva tr, #nPasiva tr').forEach(function(tr){
        var td=tr.querySelectorAll('td');
        if(td.length===2) out.push([td[0].textContent.trim(), td[1].textContent.trim()]);
      });
      return out;
    });
  };

  /* ---------------- CASH FLOW ---------------- */
  PAGES.cashflow=function(c){
    c.innerHTML = pageHead('Laporan Cash Flow','Rincian kas masuk dan kas keluar per akun lawan',
      '<button class="btn btn-success btn-sm" id="cfExcel">▤ Excel</button>'+
      '<button class="btn btn-danger btn-sm" id="cfPdf">▤ PDF</button>')+
      '<div class="filterbar">'+
        '<div class="field"><label>Tanggal Awal</label><input type="date" id="fFrom"></div>'+
        '<div class="field"><label>Tanggal Akhir</label><input type="date" id="fTo"></div>'+
        '<div class="field grow"><label>Project</label><select id="fProject"><option value="">ALL PROJECT</option>'+
          DB.projects.map(function(p){ return '<option>'+esc(p.nama)+'</option>'; }).join('')+'</select></div>'+
        '<button class="btn btn-steel" id="btnFilter">Terapkan Filter</button>'+
        '<button class="btn btn-ghost" id="btnReset">Reset</button>'+
      '</div>'+
      '<div id="cfBody"></div>';

    function akunNamaOnly(s){ return String(s||'').replace(/^[\d.]+-/,'').trim()||'(Tanpa Akun)'; }

    function groupByAkun(list, isIn){
      var map={}, order=[];
      list.forEach(function(t){
        if(/masuk$/.test(t.jenis)!==isIn) return;
        var label=akunNamaOnly(t.akunLawan);
        if(!map[label]){ map[label]={label:label, akunLawan:t.akunLawan, amount:0}; order.push(label); }
        map[label].amount += isIn?t.debet:t.kredit;
      });
      return order.map(function(k){ return map[k]; }).sort(function(a,b){ return b.amount-a.amount; });
    }

    function sectionHTML(title, barClass, rows, totalLabel, kind){
      var total=rows.reduce(function(a,b){ return a+b.amount; },0);
      return '<div class="cf-section">'+
        '<div class="cf-bar '+barClass+'">'+esc(title)+'</div>'+
        '<div class="cf-table">'+
        (rows.length?rows.map(function(r,i){
          return '<div class="cf-row'+(i%2?' alt':'')+'">'+
            '<button type="button" class="linklike" data-cf-akun="'+esc(r.akunLawan)+'" data-cf-kind="'+kind+'">'+esc(r.label)+'</button>'+
            '<span class="cf-amt">'+num0(r.amount)+'</span></div>';
        }).join(''):'<div class="cf-row"><span class="faint-italic">Tidak ada transaksi pada periode ini.</span></div>')+
        '<div class="cf-row cf-total"><b>'+esc(totalLabel)+'</b><b>'+num0(total)+'</b></div>'+
        '</div></div>';
    }

    var lastMasuk=[], lastKeluar=[], lastFrom='', lastTo='', lastProj='';
    function refresh(){
      var from=fv('fFrom'), to=fv('fTo'), proj=fv('fProject');
      lastFrom=from; lastTo=to; lastProj=proj;
      var list=DB.txns.filter(function(t){
        if(!inRange(t.tgl,from,to)) return false;
        if(proj && t.project!==proj) return false;
        return true;
      });
      lastMasuk=groupByAkun(list,true);
      lastKeluar=groupByAkun(list,false);
      var totalMasuk=lastMasuk.reduce(function(a,b){ return a+b.amount; },0);
      var totalKeluar=lastKeluar.reduce(function(a,b){ return a+b.amount; },0);
      var net=totalMasuk-totalKeluar;

      document.getElementById('cfBody').innerHTML=
        sectionHTML('KAS MASUK','cf-in',lastMasuk,'Total Kas Masuk','in')+
        sectionHTML('KAS KELUAR','cf-out',lastKeluar,'Total Kas Keluar','out')+
        '<div class="cf-net"><b>Selisih Kas Masuk – Kas Keluar</b>'+
          '<b class="'+(net<0?'neg':'pos')+'">'+numSigned(net)+'</b></div>';

      document.querySelectorAll('#cfBody [data-cf-akun]').forEach(function(b){
        b.onclick=function(){
          var akun=b.getAttribute('data-cf-akun'), kind=b.getAttribute('data-cf-kind');
          var sub=list.filter(function(t){ return t.akunLawan===akun && (/masuk$/.test(t.jenis)===(kind==='in')); })
            .map(function(t){ return {tgl:t.tgl, ref:t.ref, ket:t.ket+(t.project?' — '+t.project:''), amount:kind==='in'?t.debet:t.kredit}; })
            .sort(function(a,b){ return a.tgl<b.tgl?1:-1; });
          showTxnDrilldown(akunNamaOnly(akun), 'Rincian transaksi kas/bank'+(proj?' — Project: '+proj:''), sub);
        };
      });
    }
    refresh();
    document.getElementById('btnFilter').onclick=refresh;
    document.getElementById('btnReset').onclick=function(){
      ['fFrom','fTo','fProject'].forEach(function(id){ document.getElementById(id).value=''; });
      refresh();
    };
    document.getElementById('cfExcel').onclick=function(){
      var rows=[];
      rows.push(['KAS MASUK','']);
      lastMasuk.forEach(function(r){ rows.push([r.label, r.amount]); });
      rows.push(['Total Kas Masuk', lastMasuk.reduce(function(a,b){ return a+b.amount; },0)]);
      rows.push(['KAS KELUAR','']);
      lastKeluar.forEach(function(r){ rows.push([r.label, r.amount]); });
      rows.push(['Total Kas Keluar', lastKeluar.reduce(function(a,b){ return a+b.amount; },0)]);
      exportCSV('Cash_Flow', ['Keterangan','Jumlah'], rows);
    };
    document.getElementById('cfPdf').onclick=printPage;
  };

  /* ---------------- ANALISA PENGELUARAN ---------------- */
  PAGES.analisa=function(c){
    reportShell(c,'Analisa Pengeluaran','Pengeluaran dikelompokkan per project dan per kategori biaya',
      '<div class="field"><label>Kelompokkan</label><select id="fMode">'+
      '<option value="project">Per Project</option><option value="kategori">Per Kategori</option>'+
      '<option value="akun">Per Akun</option></select></div>');

    var tbl;
    function refresh(){
      var from=fv('fFrom'), to=fv('fTo'), mode=fv('fMode')||'project';
      var map={}, total=0;
      DB.txns.forEach(function(t){
        if(!t.kredit) return;
        if(!inRange(t.tgl,from,to)) return;
        var key = mode==='project' ? (t.project||'(Tanpa Project)')
                : mode==='kategori' ? (t.kategori||'(Tanpa Kategori)')
                : akunLabel(t.akunLawan);
        if(!map[key]) map[key]={nama:key,nilai:0,n:0};
        map[key].nilai+=t.kredit; map[key].n++;
        total+=t.kredit;
      });
      var rows=Object.keys(map).map(function(k){ return map[k]; })
        .sort(function(a,b){ return b.nilai-a.nilai; });

      document.getElementById('reportBody').innerHTML=
        '<div class="kpi-grid" style="margin-bottom:14px;">'+
          kpiCard('Total Pengeluaran',rp(total),rows.length+' kelompok','accent')+
          kpiCard('Kelompok Terbesar',rows.length?esc(rows[0].nama):'–',
            rows.length?rp(rows[0].nilai):'','accent')+
        '</div>'+
        '<div class="panel tick"><h3>10 Kelompok Pengeluaran Terbesar</h3>'+
          '<div class="panel-desc">Berdasarkan mode pengelompokan terpilih</div><div id="barTop"></div></div>'+
        '<div class="panel"><div class="toolbar">'+
          '<div class="search-box"><span class="ic">⌕</span><input type="text" id="q" placeholder="Cari…"></div>'+
          '<span class="result-count" id="cnt"></span></div><div id="tbl"></div></div>';

      renderBarList(document.getElementById('barTop'), rows.slice(0,10),{
        labelFn:function(d){ return d.nama; }, valueFn:function(d){ return d.nilai; },
        colorFn:function(d){ return /cost center|prive/i.test(d.nama)?'var(--overhead)':'var(--steel)'; },
        formatFn:rpShort});

      tbl=DataTable('tbl',[
        {key:'_no',label:'No',sort:false,render:function(r,i){ return '<span class="no">'+(i+1)+'</span>'; }},
        {key:'nama',label:mode==='project'?'Nama Project':(mode==='kategori'?'Kategori Biaya':'Nama Akun'),
         cls:'wrap',render:function(r){
          return '<b>'+esc(r.nama)+'</b>'+(/cost center|prive/i.test(r.nama)?'<span class="name-tag">Overhead</span>':''); }},
        {key:'n',label:'Jml Transaksi',num:true,render:function(r){ return num0(r.n); },
         foot:function(l){ return '<b>'+num0(l.reduce(function(a,b){return a+b.n;},0))+'</b>'; }},
        {key:'nilai',label:'Total Pengeluaran',num:true,render:function(r){ return num0(r.nilai); },
         foot:function(l){ return '<b>'+num0(l.reduce(function(a,b){return a+b.nilai;},0))+'</b>'; }},
        {key:'share',label:'% dari Total',num:true,sortVal:function(r){ return total?r.nilai/total:0; },
         render:function(r){ return total?pct(r.nilai/total):'–'; }}
      ], rows, {defaultSort:'nilai',defaultDir:'desc',perPage:20,showFoot:true,countId:'cnt',
        searchFn:function(r){ return r.nama; }, emptyText:'Tidak ada pengeluaran pada rentang ini.'});
      bindSearch('q',tbl);
    }
    refresh(); bindReportFilter(refresh,['fMode']);
    document.getElementById('fMode').addEventListener('change',refresh);
    bindExport('exp','Analisa_Pengeluaran',['Kelompok','Jml Transaksi','Total Pengeluaran'],
      function(){ return tbl.getFiltered().map(function(r){ return [r.nama,r.n,r.nilai]; }); });
  };
}
