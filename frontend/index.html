<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prakasa Group — Sistem Akuntansi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* ============ TOKENS ============ */
:root{
  --ink:#0B1D33; --navy:#1F3864; --navy-2:#2E5395; --steel:#3D6FB4; --steel-soft:#AFC6E8;
  --paper:#EEF2F8; --card:#FFFFFF; --line:#DEE5F0;
  --text:#16233D; --text-mute:#5B6B85; --text-faint:#8996AC;

  --safe:#1E8E5A; --safe-bg:#DEF3E8; --safe-line:#B7E1CD;
  --warn:#B07A00; --warn-bg:#FCF0D2; --warn-line:#F0D68B;
  --danger:#C0392B; --danger-bg:#FBE1DE; --danger-line:#F4C7C3;
  --overhead:#6E4CB0; --overhead-bg:#EDE6F8; --overhead-line:#D3C0EE;
  --neutral:#5B6B85; --neutral-bg:#EAEDF3; --neutral-line:#D5DCE8;

  --radius:10px;
  --font-display:'Space Grotesk','Inter',ui-sans-serif,system-ui,sans-serif;
  --font-body:'Inter',ui-sans-serif,system-ui,sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,Consolas,monospace;
  --sidebar-w:248px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;}
body{background:var(--paper); color:var(--text); font-family:var(--font-body); font-size:14px; line-height:1.45; -webkit-font-smoothing:antialiased;}
h1,h2,h3,h4{font-family:var(--font-display); margin:0; letter-spacing:-0.01em;}
.mono{font-family:var(--font-mono); font-variant-numeric:tabular-nums;}
.linklike{background:none; border:none; padding:0; margin:0; color:var(--steel); font:inherit;
  font-variant-numeric:tabular-nums; cursor:pointer; text-decoration:none;}
.linklike:hover{text-decoration:underline;}

/* ============ CASH FLOW (KAS MASUK/KELUAR) ============ */
.cf-section{margin-bottom:16px; border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; background:var(--card);}
.cf-bar{padding:10px 16px; font-weight:700; font-size:12.5px; letter-spacing:.03em; color:#fff;}
.cf-bar.cf-in{background:var(--safe);}
.cf-bar.cf-out{background:var(--danger);}
.cf-row{display:flex; justify-content:space-between; gap:12px; align-items:center; padding:10px 16px;
  border-bottom:1px solid var(--line); font-size:13px;}
.cf-row:last-child{border-bottom:none;}
.cf-row.alt{background:var(--paper);}
.cf-row.cf-total{background:var(--paper);}
.cf-amt{font-variant-numeric:tabular-nums; white-space:nowrap;}
.cf-net{display:flex; justify-content:space-between; padding:14px 16px; border:1px solid var(--line);
  border-radius:var(--radius); background:var(--card); font-size:14px;}

/* ============ SEARCHABLE COMBOBOX ============ */
.ssel{position:relative;}
.ssel-input{width:100%; padding:8px 11px; border-radius:8px; border:1px solid var(--line); font-size:13px;}
.ssel-list{display:none; position:absolute; left:0; right:0; top:calc(100% + 4px); z-index:80;
  max-height:220px; overflow-y:auto; background:var(--card); border:1px solid var(--line);
  border-radius:8px; box-shadow:0 8px 24px rgba(0,0,0,.12);}
.ssel-list.open{display:block;}
.ssel-opt{padding:8px 12px; font-size:13px; cursor:pointer;}
.ssel-opt:hover, .ssel-opt.on{background:var(--paper);}
.ssel-opt.ssel-empty{color:var(--text-faint); cursor:default; font-style:italic;}
.ssel-opt.ssel-empty:hover{background:none;}
::selection{background:var(--steel-soft);}
button,input,select,textarea{font-family:inherit;}

/* ============ LAYOUT ============ */
.app{display:flex; min-height:100vh;}

/* ---- SIDEBAR ---- */
.sidebar{
  width:var(--sidebar-w); flex:none; background:linear-gradient(180deg,var(--ink),#14294a 60%,var(--navy));
  color:#fff; display:flex; flex-direction:column; position:fixed; top:0; bottom:0; left:0; z-index:60;
  transition:transform .22s ease;
}
.sb-brand{display:flex; align-items:center; gap:11px; padding:18px 18px 16px 18px; border-bottom:1px solid rgba(255,255,255,.1);}
.sb-mark{width:38px;height:38px;border-radius:9px; background:linear-gradient(135deg,var(--steel),var(--navy-2));
  display:flex;align-items:center;justify-content:center; font-family:var(--font-display); font-weight:700; font-size:15px;
  border:1px solid rgba(255,255,255,.25); flex:none;}
.sb-brand .t1{font-size:14.5px; font-weight:700; font-family:var(--font-display); line-height:1.2;}
.sb-brand .t2{font-size:10px; color:var(--steel-soft); letter-spacing:.12em; text-transform:uppercase; margin-top:2px;}

.sb-search{padding:12px 14px 6px 14px;}
.sb-search input{width:100%; padding:8px 11px; border-radius:8px; border:1px solid rgba(255,255,255,.16);
  background:rgba(255,255,255,.07); color:#fff; font-size:12.5px; outline:none;}
.sb-search input::placeholder{color:#8FA3C4;}
.sb-search input:focus{border-color:var(--steel-soft); background:rgba(255,255,255,.12);}

.sb-nav{flex:1; overflow-y:auto; padding:6px 10px 22px 10px; scrollbar-width:thin;}
.sb-nav::-webkit-scrollbar{width:6px;}
.sb-nav::-webkit-scrollbar-thumb{background:rgba(255,255,255,.16); border-radius:3px;}
.sb-sec{font-size:9.5px; letter-spacing:.14em; text-transform:uppercase; color:#7E93B8; font-weight:700; padding:14px 10px 6px 10px;}
.sb-link{
  display:flex; align-items:center; gap:10px; padding:8.5px 10px; border-radius:8px; cursor:pointer;
  color:#C3D2EA; font-size:13px; font-weight:500; border:none; background:none; width:100%; text-align:left;
  transition:background .12s ease,color .12s ease;
}
.sb-link:hover{background:rgba(255,255,255,.08); color:#fff;}
.sb-link.on{background:var(--steel); color:#fff; font-weight:600;}
.sb-link .ic{width:17px; text-align:center; font-size:13px; flex:none; opacity:.9;}
.sb-link.hidden{display:none;}

.sb-foot{padding:12px 16px; border-top:1px solid rgba(255,255,255,.1); font-size:10.5px; color:#7E93B8;}

.sb-backdrop{display:none; position:fixed; inset:0; background:rgba(11,29,51,.5); z-index:55;}
.sb-backdrop.on{display:block;}

/* ---- MAIN ---- */
.main{flex:1; margin-left:var(--sidebar-w); min-width:0; display:flex; flex-direction:column;}
.topbar{
  background:var(--card); border-bottom:1px solid var(--line); padding:0 24px;
  height:60px; display:flex; align-items:center; gap:14px; position:sticky; top:0; z-index:40;
}
.hamburger{display:none; background:none; border:1px solid var(--line); border-radius:8px; padding:7px 10px; cursor:pointer; font-size:15px; color:var(--text);}
.topbar .tb-title{font-family:var(--font-display); font-size:16px; font-weight:700; color:var(--ink);}
.topbar .tb-crumb{font-size:11.5px; color:var(--text-faint); margin-left:auto;}
.topbar .tb-user{display:flex; align-items:center; gap:8px; font-size:12.5px; color:var(--text-mute); font-weight:600;
  padding-left:14px; border-left:1px solid var(--line);}
.tb-avatar{width:28px;height:28px;border-radius:50%; background:var(--navy); color:#fff; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700;}

.content{padding:22px 24px 56px 24px; max-width:1500px; width:100%;}
.page{display:none;}
.page.on{display:block; animation:fade .2s ease;}
@keyframes fade{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:none;}}

.page-head{display:flex; align-items:flex-end; justify-content:space-between; gap:14px; margin-bottom:16px; flex-wrap:wrap;}
.page-head h1{font-size:21px; font-weight:700; color:var(--ink);}
.page-head .sub{font-size:12.5px; color:var(--text-mute); margin-top:3px;}

/* ============ CARDS / PANELS ============ */
.panel{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:16px;}
.panel + .panel{margin-top:14px;}
.panel h3{font-size:13px; font-weight:700; color:var(--ink); margin-bottom:3px;}
.panel .panel-desc{font-size:11.5px; color:var(--text-mute); margin-bottom:13px;}
.grid-2{display:grid; grid-template-columns:1.4fr 1fr; gap:14px; align-items:start;}
.grid-3{display:grid; grid-template-columns:repeat(3,1fr); gap:14px; align-items:start;}
@media (max-width:980px){.grid-2,.grid-3{grid-template-columns:1fr;}}

/* corner ticks */
.tick{position:relative;}
.tick::before,.tick::after{content:"";position:absolute;width:9px;height:9px;border-color:var(--steel-soft);border-style:solid;border-width:0;pointer-events:none;}
.tick::before{top:-1px;left:-1px;border-top-width:2px;border-left-width:2px;border-top-left-radius:3px;}
.tick::after{bottom:-1px;right:-1px;border-bottom-width:2px;border-right-width:2px;border-bottom-right-radius:3px;}

/* ============ KPI ============ */
.kpi-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:12px;}
.kpi-card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:16px;}
.kpi-label{font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--text-mute); font-weight:600; margin-bottom:8px;}
.kpi-value{font-family:var(--font-mono); font-size:21px; font-weight:600; color:var(--ink);}
.kpi-sub{font-size:11.5px; color:var(--text-faint); margin-top:5px;}
.kpi-card.accent{background:linear-gradient(155deg,var(--navy),var(--navy-2)); border-color:var(--navy);}
.kpi-card.accent .kpi-label{color:#C7D5EC;} .kpi-card.accent .kpi-value{color:#fff;} .kpi-card.accent .kpi-sub{color:#AFC0DE;}
.kpi-card.danger-solid{background:linear-gradient(155deg,#C0392B,#9E2F21); border-color:#9E2F21;}
.kpi-card.danger-solid .kpi-label{color:#FBD9D4;} .kpi-card.danger-solid .kpi-value{color:#fff; font-size:25px;} .kpi-card.danger-solid .kpi-sub{color:#F4C2BB;}
.kpi-card.safe-solid{background:linear-gradient(155deg,#1E8E5A,#166B44); border-color:#166B44;}
.kpi-card.safe-solid .kpi-label{color:#D3F0E1;} .kpi-card.safe-solid .kpi-value{color:#fff; font-size:25px;} .kpi-card.safe-solid .kpi-sub{color:#BFE7D3;}

/* ============ BUTTONS ============ */
.btn{display:inline-flex; align-items:center; gap:7px; padding:8px 14px; border-radius:8px; border:1px solid transparent;
  font-size:12.5px; font-weight:600; cursor:pointer; transition:filter .12s ease, background .12s ease; white-space:nowrap;}
.btn:hover{filter:brightness(1.06);}
.btn-primary{background:var(--navy); color:#fff;}
.btn-steel{background:var(--steel); color:#fff;}
.btn-success{background:var(--safe); color:#fff;}
.btn-danger{background:var(--danger); color:#fff;}
.btn-warn{background:#D89A00; color:#fff;}
.btn-ghost{background:var(--card); color:var(--text-mute); border-color:var(--line);}
.btn-ghost:hover{border-color:var(--steel); color:var(--text);}
.btn-sm{padding:5px 10px; font-size:11.5px; border-radius:6px;}
.btn-row{display:flex; gap:8px; flex-wrap:wrap;}

/* ============ FILTER BAR ============ */
.filterbar{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:14px 16px; margin-bottom:14px;
  display:flex; gap:14px; align-items:flex-end; flex-wrap:wrap;}
.field{display:flex; flex-direction:column; gap:5px; min-width:150px;}
.field label{font-size:10.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--text-mute); font-weight:700;}
.field input,.field select,.field textarea{
  padding:8px 10px; border-radius:8px; border:1px solid var(--line); background:var(--paper);
  font-size:12.5px; color:var(--text); outline:none; min-width:0;}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--steel); background:#fff;}
.field.grow{flex:1;}

/* ============ TABLE ============ */
.toolbar{display:flex; align-items:center; gap:9px; flex-wrap:wrap; margin-bottom:12px;}
.search-box{position:relative; flex:1; min-width:180px; max-width:330px;}
.search-box input{width:100%; padding:8px 12px 8px 30px; border-radius:8px; border:1px solid var(--line);
  font-size:12.5px; background:var(--paper); color:var(--text); outline:none;}
.search-box input:focus{border-color:var(--steel); background:#fff;}
.search-box .ic{position:absolute; left:10px; top:50%; transform:translateY(-50%); font-size:12px; color:var(--text-faint);}
.result-count{font-size:11px; color:var(--text-faint); margin-left:auto; font-family:var(--font-mono);}

.table-scroll{overflow-x:auto; border:1px solid var(--line); border-radius:var(--radius); background:var(--card);}
table.dtab{width:100%; border-collapse:collapse; font-size:12.3px; min-width:640px;}
table.dtab thead th{background:var(--navy); color:#fff; text-align:left; font-weight:600; font-size:10.6px;
  text-transform:uppercase; letter-spacing:.03em; padding:10px 12px; white-space:nowrap; cursor:pointer; user-select:none;
  position:sticky; top:0;}
table.dtab thead th.num, table.dtab td.num{text-align:right;}
table.dtab thead th.nosort{cursor:default;}
table.dtab thead th .arrow{opacity:.45; font-size:9px; margin-left:3px;}
table.dtab thead th.sorted .arrow{opacity:1;}
table.dtab tbody td{padding:9px 12px; border-bottom:1px solid var(--line); white-space:nowrap;}
table.dtab tbody td.num{font-family:var(--font-mono); text-align:right;}
table.dtab tbody td.wrap{white-space:normal; min-width:200px;}
table.dtab tbody tr:hover{background:#F6F9FD;}
table.dtab tbody tr:last-child td{border-bottom:none;}
table.dtab tbody td .no{color:var(--text-faint); font-family:var(--font-mono); font-size:11px;}
table.dtab tbody td .btn-row{flex-wrap:nowrap;}
table.dtab tfoot td{padding:10px 12px; font-weight:700; background:var(--paper); border-top:2px solid var(--line); font-size:12.3px;}
table.dtab tfoot td.num{font-family:var(--font-mono); text-align:right;}
.row-group td{background:#EAF0F9 !important; font-weight:700; color:var(--navy); font-size:11.5px; text-transform:uppercase; letter-spacing:.04em;}
.row-sub td{background:#F5F8FC !important; font-weight:600;}
.empty-row td{text-align:center; color:var(--text-faint); padding:28px;}

.pager{display:flex; align-items:center; gap:6px; justify-content:flex-end; margin-top:12px; flex-wrap:wrap;}
.pager button{border:1px solid var(--line); background:var(--card); color:var(--text-mute); border-radius:6px;
  padding:5px 10px; font-size:12px; cursor:pointer; font-weight:600;}
.pager button:hover:not(:disabled){border-color:var(--steel); color:var(--text);}
.pager button.on{background:var(--navy); border-color:var(--navy); color:#fff;}
.pager button:disabled{opacity:.4; cursor:not-allowed;}
.pager .pinfo{font-size:11.5px; color:var(--text-faint); margin-right:auto; font-family:var(--font-mono);}

/* ============ CHIPS / STATUS ============ */
.chip{display:inline-flex; align-items:center; gap:5px; padding:3.5px 9px; border-radius:100px; font-size:11px; font-weight:600; border:1px solid; white-space:nowrap;}
.chip .sig{width:6px;height:6px;border-radius:50%;flex:none;}
.chip.safe{background:var(--safe-bg);border-color:var(--safe-line);color:#166B44;} .chip.safe .sig{background:var(--safe);}
.chip.warn{background:var(--warn-bg);border-color:var(--warn-line);color:#8A6100;} .chip.warn .sig{background:var(--warn);}
.chip.danger{background:var(--danger-bg);border-color:var(--danger-line);color:#9E2F21;} .chip.danger .sig{background:var(--danger);}
.chip.neutral{background:var(--neutral-bg);border-color:var(--neutral-line);color:var(--text-mute);font-style:italic;font-weight:500;} .chip.neutral .sig{background:var(--text-faint);}
.chip.info{background:#E7EFFC;border-color:#C7D9F4;color:#1F3864;} .chip.info .sig{background:var(--steel);}
table.dtab td.status-safe{background:var(--safe-bg); color:#166B44; font-weight:700; text-align:center;}
table.dtab td.status-warn{background:var(--warn-bg); color:#8A6100; font-weight:700; text-align:center;}
table.dtab td.status-danger{background:var(--danger-bg); color:#9E2F21; font-weight:700; text-align:center;}
table.dtab td.status-neutral{background:var(--neutral-bg); color:var(--text-mute); font-weight:600; font-style:italic; text-align:center;}
.faint-italic{color:var(--text-faint); font-style:italic;}
.pos{color:var(--safe);} .neg{color:var(--danger);}
.name-tag{display:inline-block; font-size:9px; font-weight:700; letter-spacing:.03em; text-transform:uppercase;
  padding:1.5px 6px; border-radius:4px; margin-left:6px; background:var(--overhead-bg); color:#5A3C99;}

/* ============ ALERTS ============ */
.alerts{display:flex; flex-direction:column; gap:8px; margin-bottom:14px;}
.alert{display:flex; align-items:flex-start; gap:10px; padding:11px 14px; border-radius:9px; font-size:12.8px; border:1px solid; line-height:1.5;}
.alert .ic{font-size:14px; flex:none; margin-top:1px;}
.alert.danger{background:var(--danger-bg);border-color:var(--danger-line);color:#7A2318;}
.alert.warn{background:var(--warn-bg);border-color:var(--warn-line);color:#7A5600;}
.alert.info{background:#E7EFFC;border-color:#C7D9F4;color:#1F3864;}
.na-box{background:var(--neutral-bg); border:1px solid var(--neutral-line); border-radius:9px; padding:14px 16px; font-size:12.5px; color:var(--text-mute); line-height:1.55;}

/* ============ MODAL ============ */
.modal-back{position:fixed; inset:0; background:rgba(11,29,51,.55); z-index:100; display:none; align-items:flex-start; justify-content:center; padding:40px 16px; overflow-y:auto;}
.modal-back.on{display:flex;}
.modal{background:var(--card); border-radius:12px; width:100%; max-width:600px; box-shadow:0 18px 50px rgba(11,29,51,.3); animation:pop .18s ease;}
.modal.wide{max-width:860px;}
@keyframes pop{from{opacity:0;transform:translateY(-10px) scale(.98);}to{opacity:1;transform:none;}}
.modal-head{padding:16px 20px; border-bottom:1px solid var(--line); display:flex; align-items:center; justify-content:space-between;}
.modal-head h3{font-size:15px; font-weight:700;}
.modal-close{background:none;border:none;font-size:20px;color:var(--text-faint);cursor:pointer;line-height:1;padding:0 4px;}
.modal-close:hover{color:var(--danger);}
.modal-body{padding:18px 20px;}
.modal-foot{padding:14px 20px; border-top:1px solid var(--line); display:flex; gap:9px; justify-content:flex-end;}
.form-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
.form-grid .full{grid-column:1/-1;}
@media (max-width:600px){.form-grid{grid-template-columns:1fr;}}

/* ============ TOAST ============ */
.toast-wrap{position:fixed; bottom:22px; right:22px; z-index:200; display:flex; flex-direction:column; gap:9px;}
.toast{background:var(--ink); color:#fff; padding:11px 16px; border-radius:9px; font-size:12.5px; font-weight:500;
  box-shadow:0 8px 24px rgba(11,29,51,.28); animation:slidein .2s ease; max-width:340px;}
.toast.success{background:var(--safe);} .toast.danger{background:var(--danger);}
@keyframes slidein{from{opacity:0;transform:translateX(20px);}to{opacity:1;transform:none;}}

/* ============ COA TREE ============ */
.coa-row{display:flex; align-items:center; gap:10px; padding:9px 14px; border-bottom:1px solid var(--line); font-size:13px;}
.coa-row:hover{background:#F6F9FD;}
.coa-row.lv1{background:#EAF0F9; font-weight:700; color:var(--navy);}
.coa-row.lv2{background:#F5F8FC; font-weight:600;}
.coa-row .toggle{width:18px; text-align:center; cursor:pointer; color:var(--steel); font-weight:700; flex:none; user-select:none;}
.coa-row .kode{font-family:var(--font-mono); font-weight:600; color:var(--steel); width:78px; flex:none; font-size:12px;}
.coa-row.lv1 .kode,.coa-row.lv2 .kode{color:var(--navy);}
.coa-row .nm{flex:1; min-width:0;}
.coa-row .tipe{font-size:10.5px; color:var(--text-faint); font-style:italic;}
.coa-row .acts{display:flex; gap:6px; flex:none;}
.coa-row.hide{display:none;}

/* ============ DONUT / BARS (dashboard) ============ */
.donut-wrap{display:flex; align-items:center; gap:18px; flex-wrap:wrap;}
.donut{width:118px;height:118px;border-radius:50%;position:relative;flex:none;}
.donut::after{content:"";position:absolute;inset:20%;background:var(--card);border-radius:50%;}
.donut-center{position:absolute;inset:20%;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--font-mono);z-index:2;}
.donut-center .n{font-size:19px;font-weight:700;color:var(--ink);line-height:1;}
.donut-center .l{font-size:8.5px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.05em;margin-top:2px;}
.legend{display:flex;flex-direction:column;gap:7px;flex:1;min-width:150px;}
.legend-row{display:flex;align-items:center;gap:8px;font-size:12px;}
.legend-swatch{width:9px;height:9px;border-radius:3px;flex:none;}
.legend-row .legend-label{flex:1;color:var(--text);}
.legend-row .legend-val{font-family:var(--font-mono);color:var(--text-mute);font-weight:600;}

.barlist{display:flex;flex-direction:column;gap:11px;}
.barlist-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px;gap:8px;}
.barlist-name{font-size:12.3px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.barlist-val{font-family:var(--font-mono);font-size:12px;color:var(--text-mute);flex:none;}
.barlist-track{height:7px;background:var(--paper);border-radius:100px;overflow:hidden;}
.barlist-fill{height:100%;border-radius:100px;background:var(--steel);}

.dualbar-row{margin-bottom:13px;}
.dualbar-row .dtitle{font-size:12px;font-weight:600;margin-bottom:6px;}
.dualbar-line{display:flex;align-items:center;gap:8px;margin-bottom:3px;}
.dualbar-line .dlabel{width:64px;font-size:10px;color:var(--text-faint);flex:none;}
.dualbar-line .track{flex:1;height:7px;background:var(--paper);border-radius:100px;overflow:hidden;}
.dualbar-line .fill{height:100%;border-radius:100px;}
.dualbar-line .fill.fin{background:var(--steel);} .dualbar-line .fill.fld{background:#E0A100;}
.dualbar-line .dval{width:44px;text-align:right;font-family:var(--font-mono);font-size:10.5px;color:var(--text-mute);flex:none;}

.segmented{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;flex-wrap:wrap;}
.seg-btn{border:none;cursor:pointer;background:var(--card);font-size:12.5px;font-weight:600;color:var(--text-mute);
  padding:9px 15px;border-right:1px solid var(--line);white-space:nowrap;}
.seg-btn:last-child{border-right:none;}
.seg-btn:hover{background:var(--paper);color:var(--text);}
.seg-btn.on{background:var(--navy);color:#fff;}
.seg-btn .seg-sub{display:block;font-size:9.5px;font-weight:500;opacity:.75;margin-top:1px;}
.period-bar{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin-bottom:14px;
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
.period-bar .plabel{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-mute);font-weight:700;flex:none;}
.period-note{font-size:11.5px;color:var(--text-faint);margin-left:auto;}
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:26px 0 12px 0;flex-wrap:wrap;}
.section-head h2{font-size:15.5px;font-weight:700;color:var(--ink);display:flex;align-items:center;gap:8px;}
.section-head .icon-chip{width:26px;height:26px;border-radius:7px;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;flex:none;}
.section-head .desc{font-size:12px;color:var(--text-mute);}
.section-divider{border:none;border-top:1px solid var(--line);margin:32px 0 0 0;}

/* ============ RESPONSIVE ============ */
@media (max-width:1024px){
  .sidebar{transform:translateX(-100%);}
  .sidebar.open{transform:none;}
  .main{margin-left:0;}
  .hamburger{display:block;}
}
@media (max-width:640px){
  .topbar{padding:0 14px;} .content{padding:16px 14px 44px 14px;}
  .page-head h1{font-size:18px;}
  .topbar .tb-crumb{display:none;}
  .period-bar{flex-direction:column;align-items:stretch;gap:10px;}
  .segmented{width:100%;flex-wrap:nowrap;}
  .seg-btn{flex:1 1 0;padding:9px 5px;font-size:11.5px;text-align:center;}
  .seg-btn .seg-sub{font-size:8.5px;}
  .period-note{margin-left:0;}
  .field{min-width:100%;}
}

/* ============ PRINT ============ */
@media print{
  .sidebar,.topbar,.toolbar,.filterbar,.btn-row,.pager,.sb-backdrop,.toast-wrap{display:none !important;}
  .main{margin-left:0;} .content{padding:0;}
  .panel,.table-scroll{border:none;} body{background:#fff;}
  table.dtab thead th{background:#1F3864 !important; -webkit-print-color-adjust:exact; print-color-adjust:exact;}
  table.dtab td.status-safe,table.dtab td.status-warn,table.dtab td.status-danger{-webkit-print-color-adjust:exact; print-color-adjust:exact;}
}

/* ============ LOGIN (added — auth gate) ============ */
#loginScreen{position:fixed; inset:0; z-index:100; display:flex; align-items:center; justify-content:center;
  background:linear-gradient(160deg,var(--ink),#14294a 55%,var(--navy)); padding:20px;}
.login-card{width:100%; max-width:380px; background:var(--card); border-radius:14px; padding:32px 28px;
  box-shadow:0 20px 60px rgba(0,0,0,.35);}
.login-card .sb-mark{width:44px;height:44px;border-radius:10px;background:linear-gradient(135deg,var(--steel),var(--navy-2));
  display:flex;align-items:center;justify-content:center;color:#fff;font-family:var(--font-display);font-weight:700;
  font-size:16px;margin-bottom:14px;}
.login-card h1{font-size:19px;margin-bottom:2px;}
.login-card .sub{color:var(--text-mute); font-size:12.5px; margin-bottom:20px;}
.login-card label{display:block; font-size:12px; font-weight:600; color:var(--text-mute); margin:14px 0 5px;}
.login-card input{width:100%; padding:10px 12px; border-radius:8px; border:1px solid var(--line); font-size:14px;}
.login-card button{width:100%; margin-top:20px; padding:11px; border-radius:8px; border:none; background:var(--navy-2);

.login-card button:disabled{opacity:.6; cursor:default;}
.login-err{margin-top:12px; padding:9px 11px; border-radius:8px; background:var(--danger-bg); color:var(--danger);

.login-err.on{display:block;}
#appRoot.pre-auth{display:none;}
.tb-user{display:flex; align-items:center; gap:9px;}
.tb-user #btnLogout{margin-left:8px;}

<script>
/* ============================================================
   PRAKASA GROUP — ACC v2.0
   Core: state, storage, helpers, router, shared components
   ============================================================ */

/* ---------------- format ---------------- */
function rp(n){
  if(n===null||n===undefined||Number.isNaN(n)) return '–';
  var neg=n<0;
  return (neg?'-Rp ':'Rp ')+Math.round(Math.abs(n)).toLocaleString('id-ID');
}
function num0(n){
  if(n===null||n===undefined||Number.isNaN(n)) return '0';
  return Math.round(n).toLocaleString('id-ID');
}
function numSigned(n){
  if(!n) return '0';
  return (n<0?'-':'')+Math.round(Math.abs(n)).toLocaleString('id-ID');
}
function rpShort(n){
  if(n===null||n===undefined) return '–';
  var neg=n<0,v=Math.abs(n),out;
  if(v>=1e9) out=(v/1e9).toFixed(2).replace(/\.00$/,'')+' M';
  else if(v>=1e6) out=(v/1e6).toFixed(1).replace(/\.0$/,'')+' Jt';
  else out=v.toLocaleString('id-ID');
  return (neg?'-':'')+'Rp '+out;
}
function pct(n,opt){
  opt=opt||{};
  if(n===null||n===undefined||Number.isNaN(n)) return '–';
  var v=n*100;
  return (opt.signed&&v>0?'+':'')+v.toFixed(1)+'%';
}
function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function fmtDate(iso){
  if(!iso) return '–';
  var p=String(iso).split('-');
  if(p.length!==3) return iso;
  return p[2]+'-'+p[1]+'-'+p[0];
}
function todayISO(){ return new Date().toISOString().slice(0,10); }

/* ---------------- status ---------------- */
function statusInfo(raw){
  var s=(raw===null||raw===undefined)?'':String(raw).toUpperCase();
  if(s.indexOf('MELEBIHI')>-1||s==='MERAH') return {cls:'danger',label:'⚠ Melebihi RAP'};
  if(s.indexOf('HAMPIR')>-1||s==='KUNING') return {cls:'warn',label:'Hampir Habis RAP'};
  if(s==='AMAN'||s==='HIJAU') return {cls:'safe',label:'Aman'};
  if(s.indexOf('DIV/0')>-1||s.indexOf('VALUE')>-1||s==='') return {cls:'neutral',label:'Data Tidak Lengkap'};
  return {cls:'neutral',label:raw};
}
function statusCellClass(raw){ return 'status-'+statusInfo(raw).cls; }
function statusCellText(raw){ return esc(statusInfo(raw).label); }

/* ============================================================
   STORAGE / STATE
   ============================================================ */
var STORE_KEY='prakasa_acc_v2';
var SUSPENSE_AKUN='9.9.9-Belum Diklasifikasi';
var DB=null;

function seedDB(){
  var customers=[], vendors=[], ci=1, vi=1;
  SEED.relasi.forEach(function(r){
    var isCust = /^Pr-/i.test(r.nama);
    if(isCust){
      customers.push({id:'c'+ci, kode:'CU'+String(ci).padStart(3,'0'), nama:r.nama,
        alamat:r.alamat||'', telp:r.telp||'', email:''});
      ci++;
    } else {
      vendors.push({id:'v'+vi, kode:'VE'+String(vi).padStart(3,'0'), nama:r.nama,
        alamat:r.alamat||'', telp:r.telp||'', email:''});
      vi++;
    }
  });

  // names actually used on kas/bank/jurnal entries — a project's display
  // name doesn't always match these 1:1 (see guessLedgerName above)
  var ledgerNameSet={};
  SEED.txns.forEach(function(t){ if(t.p) ledgerNameSet[t.p]=1; });
  (SEED.jurnal||[]).forEach(function(j){ if(j.p) ledgerNameSet[j.p]=1; });
  var knownLedgerNames=Object.keys(ledgerNameSet);

  // projects: dashboard rows (with values) + master list + names seen in transactions
  var projects=[], seen={}, pi=1;
  function pushProject(nama, kontrak, rap, progress){
    var key=nama.toLowerCase();
    if(seen[key]) return; seen[key]=1;
    var ledgerName=ledgerNameSet[nama]?nama:guessLedgerName(nama, knownLedgerNames);
    projects.push({id:'p'+pi++, nama:nama, ledgerName:ledgerName, kontrak:kontrak||0, rap:rap||0,
      progress:progress, pemberiProyek:guessPemberiProyek(nama), costCenter:0, admFee:0});
  }
  (SEED.progress.rows||[]).forEach(function(r){
    pushProject(r.nama, r.kontrak, r.rap, (typeof r.progress_lapangan==='number')?r.progress_lapangan:null);
  });
  (SEED.projmaster||[]).forEach(function(nm){ pushProject(nm, 0, 0, null); });
  knownLedgerNames.forEach(function(nm){ pushProject(nm, 0, 0, null); });

  var coa=SEED.coa.map(function(c,i){
    return {id:'a'+(i+1), kode:c.kode, nama:c.nama, level:c.level, tipe:coaTipe(c.kode)};
  });

  // transactions: give each an id + ref no
  var counters={};
  var txns=SEED.txns.map(function(t,i){
    var isIn=t.d>0;
    var isBank=/^Bank/i.test(t.s);
    var pref=(isBank?(isIn?'BI':'BO'):(isIn?'CI':'CO'));
    var mo=t.t.slice(2,4)+t.t.slice(5,7);
    counters[pref]=(counters[pref]||0)+1;
    return {
      id:'t'+(i+1),
      tgl:t.t, ref:pref+'-'+mo+'-'+String(counters[pref]).padStart(4,'0'),
      akunKas:t.s, akunLawan:t.a, project:t.p, relasi:t.r,
      kategori:t.g, ket:t.k,
      debet:t.d, kredit:t.c,
      jenis:(isBank?'bank':'kas')+'_'+(isIn?'masuk':'keluar')
    };
  });

  var jurnal=(SEED.jurnal||[]).map(function(j,i){
    return {id:'j'+(i+1), tgl:j.t, ref:'JU-'+String(i+1).padStart(4,'0'), akun:j.a,
      project:j.p, relasi:j.r, kategori:j.g, ket:j.k, debet:j.d, kredit:j.c};
  });

  return {customers:customers, vendors:vendors, projects:projects, coa:coa, txns:txns, jurnal:jurnal, hutangOverrides:{}};
}

/* "Pemberi Proyek" — inferred once from the project name so the
   Dashboard filter has something to work with; editable per-project
   afterwards via Master Project (task: filter proyek by pemberi). */
var PEMBERI_PROYEK_LIST=['Kemhan','Bina Marga','PUPR','Korem','Kodim','Koramil','BJB','Dinas','Diknas'];
function guessPemberiProyek(nama){
  var low=(nama||'').toLowerCase();
  for(var i=0;i<PEMBERI_PROYEK_LIST.length;i++){
    var p=PEMBERI_PROYEK_LIST[i];
    if(low.indexOf(p.toLowerCase())>-1) return p;
  }
  return 'Lainnya';
}

/* Some project display names (e.g. "Kemhan Bangun Rumdis Cimahi") don't
   match the shorter name actually used on kas/bank/jurnal entries (e.g.
   "Rumdis Cimahi") — this maps a display name to the closest known
   ledger name so transactions can still be found & totalled. Picks the
   longest known ledger name that appears inside the display name (case
   insensitive); returns '' when nothing matches so it's obvious in the
   UI that the link needs a manual fix via Master Project. */
function guessLedgerName(displayName, knownLedgerNames){
  var low=(displayName||'').toLowerCase();
  var best='';
  knownLedgerNames.forEach(function(k){
    if(!k) return;
    if(low.indexOf(k.toLowerCase())>-1 && k.length>best.length) best=k;
  });
  return best;
}

/* RAP cost categories, matched by COA code prefix on akunLawan/akun
   (format "kode-nama"), used by the Dashboard "Rincian Progress per
   Proyek" table to total Biaya Bahan / Upah / Akomodasi per project. */
var RAP_COST_CODES={bahan:['5.1.1'], upah:['5.1.2','5.1.9'], akomodasi:['5.1.26','6.2.36']};
function akunKodeOf(akunStr){ return (akunStr||'').split('-')[0]; }
function matchesRapCost(akunStr, kind){ return RAP_COST_CODES[kind].indexOf(akunKodeOf(akunStr))>-1; }

/* Live per-project progress/RAP figures, computed from current
   DB.txns + DB.jurnal (not a static snapshot) — powers the Dashboard
   "Rincian Progress per Proyek" table. Biaya Bahan/Upah/Akomodasi are
   real cost postings against that project (cash ledger + jurnal umum
   accrual entries); Cost Center & Adm Fee are entered manually per
   project (Master Project) since they're overhead allocations, not
   something derivable from the ledger alone. */
function computeProjectProgressRows(){
  return DB.projects.map(function(p, i){
    var ledger=p.ledgerName||p.nama;
    var bahan=0, upah=0, akomodasi=0;
    DB.txns.forEach(function(t){
      if(t.project!==ledger || !/keluar$/.test(t.jenis)) return;
      if(matchesRapCost(t.akunLawan,'bahan')) bahan+=t.kredit;
      else if(matchesRapCost(t.akunLawan,'upah')) upah+=t.kredit;
      else if(matchesRapCost(t.akunLawan,'akomodasi')) akomodasi+=t.kredit;
    });
    DB.jurnal.forEach(function(j){
      if(j.project!==ledger) return;
      if(matchesRapCost(j.akun,'bahan')) bahan+=j.debet;
      else if(matchesRapCost(j.akun,'upah')) upah+=j.debet;
      else if(matchesRapCost(j.akun,'akomodasi')) akomodasi+=j.debet;
    });
    var totalRap=bahan+upah+akomodasi;
    var sisaRap=(p.rap||0)-totalRap;
    var ratio=p.rap?totalRap/p.rap:null;
    var statusRap=ratio===null?'':(ratio>1?'MELEBIHI':(ratio>0.9?'HAMPIR':'AMAN'));
    var costCenter=p.costCenter||0, admFee=p.admFee||0;
    var totalPengeluaran=totalRap+costCenter+admFee;
    var hasilUsaha=(p.kontrak||0)-totalPengeluaran;
    return {
      no:i+1, id:p.id, nama:p.nama, ledgerName:ledger, linked:!!ledger,
      pemberiProyek:p.pemberiProyek||'Lainnya',
      kontrak:p.kontrak||0, rap:p.rap||0,
      bahan:bahan, bahanPct:totalRap?bahan/totalRap:0,
      upah:upah, upahPct:totalRap?upah/totalRap:0,
      akomodasi:akomodasi, akomodasiPct:totalRap?akomodasi/totalRap:0,
      totalRap:totalRap, totalRapPct:p.rap?totalRap/p.rap:0,
      sisaRap:sisaRap, sisaRapPct:p.rap?sisaRap/p.rap:0,
      statusRap:statusRap,
      costCenter:costCenter, admFee:admFee,
      totalPengeluaran:totalPengeluaran, totalPengeluaranPct:p.kontrak?totalPengeluaran/p.kontrak:0,
      hasilUsaha:hasilUsaha, hasilUsahaPct:p.kontrak?hasilUsaha/p.kontrak:0,
      progressLapangan:(typeof p.progress==='number')?p.progress:null,
    };
  });
}

/* Underlying kas/bank + jurnal umum postings behind a project's RAP cost
   figure — feeds the generic drill-down modal (task: klik angka untuk
   lihat riwayat transaksi). kind is 'bahan' | 'upah' | 'akomodasi' | 'all'. */
function projectCostTxns(projectNama, kind){
  var kinds = kind==='all' ? ['bahan','upah','akomodasi'] : [kind];
  function matchesAny(akun){ return kinds.some(function(k){ return matchesRapCost(akun,k); }); }
  var list=[];
  DB.txns.forEach(function(t){
    if(t.project!==projectNama || !/keluar$/.test(t.jenis) || !matchesAny(t.akunLawan)) return;
    list.push({tgl:t.tgl, ref:t.ref, ket:t.ket+' — '+t.akunLawan, amount:t.kredit});
  });
  DB.jurnal.forEach(function(j){
    if(j.project!==projectNama || !matchesAny(j.akun)) return;
    list.push({tgl:j.tgl, ref:j.ref, ket:j.ket+' — '+j.akun, amount:j.debet});
  });
  return list.sort(function(a,b){ return a.tgl<b.tgl?1:-1; });
}

var HUTANG_DAGANG_CODE='2.1.1';

/* Trial Hutang: per-nota (invoice-level) payable status. A "nota" is a
   jurnal umum entry crediting Hutang Dagang (the accrual when goods/
   services are received on credit); it's paid off later by a kas/bank
   keluar transaction whose akun lawan is also Hutang Dagang. Payments
   are matched to notas per vendor, oldest nota first (FIFO) — this is
   a best-effort auto-link (the books don't record nota-to-payment
   references directly), so a vendor with several open notas may show
   an earlier one as paid before a later one if payments don't state
   which nota they cover. Adjust manually if that ordering is wrong for
   a specific case.  */
function computeHutangDagangRows(){
  var notas=DB.jurnal.filter(function(j){
    return akunKodeOf(j.akun)===HUTANG_DAGANG_CODE && j.kredit>0;
  }).map(function(j){
    return {id:j.id, tgl:j.tgl, ref:j.ref, vendor:j.relasi||'(Tanpa Vendor)', project:j.project||'',
      ket:j.ket, amount:j.kredit, paid:0};
  }).sort(function(a,b){ return a.tgl<b.tgl?-1:1; });

  var paymentsByVendor={};
  DB.txns.forEach(function(t){
    if(!/keluar$/.test(t.jenis) || akunKodeOf(t.akunLawan)!==HUTANG_DAGANG_CODE) return;
    var v=t.relasi||'(Tanpa Vendor)';
    paymentsByVendor[v]=(paymentsByVendor[v]||0)+t.kredit;
  });

  var byVendor={};
  notas.forEach(function(n){ (byVendor[n.vendor]=byVendor[n.vendor]||[]).push(n); });
  Object.keys(byVendor).forEach(function(v){
    var pool=paymentsByVendor[v]||0;
    byVendor[v].forEach(function(n){
      var take=Math.min(pool, n.amount);
      n.paid=take; pool-=take;
    });
  });

  var overrides=DB.hutangOverrides||{};
  return notas.map(function(n){
    var ov=overrides[n.id];
    // A manual override is a standalone correction for this one nota — it
    // does not re-run FIFO allocation for the vendor's other notas.
    var paid=ov?ov.paid:n.paid;
    var sisa=Math.max(0, n.amount-paid);
    var status=ov?ov.status:(sisa<=0.5?'LUNAS':(paid>0?'SEBAGIAN':'BELUM_BAYAR'));
    return {id:n.id, tgl:n.tgl, ref:n.ref, vendor:n.vendor, project:n.project, ket:n.ket,
      amount:n.amount, paid:paid, sisa:sisa, status:status, manual:!!ov};
  });
}
function hutangStatusInfo(status){
  if(status==='LUNAS') return {cls:'safe', label:'Lunas'};
  if(status==='SEBAGIAN') return {cls:'warn', label:'Dibayar Sebagian'};
  return {cls:'danger', label:'Belum Dibayar'};
}

/* Generic read-only drill-down: click an amount/label anywhere in the
   app -> see the list of transactions behind it (Cash Flow, Laba Rugi,
   Dashboard progress, Trial Hutang, etc). list items: {tgl,ref,ket,amount}. */
function showTxnDrilldown(title, subtitle, list){
  var total=list.reduce(function(a,b){ return a+(b.amount||0); },0);
  var body=(subtitle?'<div class="panel-desc" style="margin-bottom:10px;">'+esc(subtitle)+'</div>':'')+
    '<div class="table-scroll"><table class="dtab"><thead><tr>'+
    '<th>Tanggal</th><th>Ref No</th><th>Description</th><th style="text-align:right;">Amount</th>'+
    '</tr></thead><tbody>'+
    (list.length?list.map(function(r){
      return '<tr><td>'+fmtDate(r.tgl)+'</td><td class="mono" style="font-size:11.5px;">'+esc(r.ref||'–')+'</td>'+

/* ============================================================
   SEARCHABLE COMBOBOX (type to filter a long list of options)
   Renders into a container div; keeps its value in sync with a
   companion <input type="hidden"> so existing fv('f_xxx') reads used
   all over the app keep working unchanged.
   opts: {options:[{value,label}], value, placeholder, allowCustom}
   ============================================================ */
function searchableSelect(containerId, hiddenId, opts){
  opts=opts||{};
  var options=opts.options||[];
  var allowCustom=!!opts.allowCustom;
  var root=document.getElementById(containerId);
  var hidden=document.getElementById(hiddenId);
  if(!root||!hidden) return;
  root.className=(root.className?root.className+' ':'')+'ssel';
  root.innerHTML='<input type="text" class="ssel-input" autocomplete="off" placeholder="'+
    esc(opts.placeholder||'Cari…')+'"><div class="ssel-list"></div>';
  var input=root.querySelector('.ssel-input');
  var list=root.querySelector('.ssel-list');

  function labelFor(val){
    var o=options.find(function(o){ return o.value===val; });
    return o?o.label:val;
  }
  function setValue(v){
    hidden.value=v||'';
    input.value=v?labelFor(v):'';
  }
  function render(filter){
    var f=(filter||'').toLowerCase();
    var filtered=f?options.filter(function(o){ return o.label.toLowerCase().indexOf(f)>-1; }):options;
    filtered=filtered.slice(0,300);
    list.innerHTML=filtered.map(function(o){
      return '<div class="ssel-opt'+(o.value===hidden.value?' on':'')+'" data-val="'+esc(o.value)+'">'+esc(o.label)+'</div>';
    }).join('') || '<div class="ssel-opt ssel-empty">Tidak ditemukan'+
      (allowCustom&&filter?' — tekan Enter untuk pakai "'+esc(filter)+'"':'')+'</div>';
    list.querySelectorAll('.ssel-opt[data-val]').forEach(function(el){
      el.onmousedown=function(e){ e.preventDefault(); setValue(el.getAttribute('data-val')); list.classList.remove('open'); };
    });
  }
  input.value=hidden.value?labelFor(hidden.value):'';
  input.addEventListener('focus', function(){ render(''); list.classList.add('open'); });
  input.addEventListener('input', function(){ render(input.value); list.classList.add('open'); });
  input.addEventListener('keydown', function(e){
    if(e.key==='Enter'){
      e.preventDefault();
      var firstOpt=list.querySelector('.ssel-opt[data-val]');
      if(allowCustom && input.value && !options.some(function(o){ return o.label===input.value; })){
        setValue(input.value);
      } else if(firstOpt){ setValue(firstOpt.getAttribute('data-val')); }
      list.classList.remove('open');
    } else if(e.key==='Escape'){ list.classList.remove('open'); input.blur(); }
  });
  input.addEventListener('blur', function(){
    setTimeout(function(){
      list.classList.remove('open');
      if(allowCustom){ if(input.value!==labelFor(hidden.value)) setValue(input.value); }
      else if(input.value!==labelFor(hidden.value)){ setValue(hidden.value); } // snap back to last valid pick
    }, 120);
  });
}

/* ---------------- CSV export ---------------- */
function exportCSV(filename, headers, rows){
  var esc2=function(v){
    var s=String(v==null?'':v);
    // neutralise CSV/formula injection: a cell starting with =+-@ can be
    // read as a formula by Excel/Sheets when the file is opened later
    if(/^[=+\-@]/.test(s)) s="'"+s;
    if(/[",\n;]/.test(s)) return '"'+s.replace(/"/g,'""')+'"';
    return s;
  };
  var lines=[headers.map(esc2).join(';')];
  rows.forEach(function(r){ lines.push(r.map(esc2).join(';')); });
  var blob=new Blob(['\ufeff'+lines.join('\r\n')],{type:'text/csv;charset=utf-8;'});
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=filename+'.csv';
  document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); },400);
  toast('File '+filename+'.csv diunduh — bisa dibuka di Excel.','success');
}

/* ============================================================
   DATA TABLE COMPONENT
   columns: [{key,label,num,sort:false,cls,render,sortVal,foot}]
   ============================================================ */
function DataTable(mountId, columns, rows, opts){
  opts=opts||{};
  var state={sortKey:opts.defaultSort||null, sortDir:opts.defaultDir||'desc',
             search:'', page:1, perPage:opts.perPage||15};
  var mount=document.getElementById(mountId);
  if(!mount) return null;

  function filtered(){
    var out=rows;
    if(state.search && opts.searchFn){
      var q=state.search.toLowerCase();
      out=out.filter(function(r){ return opts.searchFn(r).toLowerCase().indexOf(q)>-1; });
    }
    if(state.sortKey){
      var col=columns.find(function(c){ return c.key===state.sortKey; });
      if(col){
        out=out.slice().sort(function(a,b){
          var av=col.sortVal?col.sortVal(a):a[state.sortKey];
          var bv=col.sortVal?col.sortVal(b):b[state.sortKey];
          if(av===null||av===undefined) av=-Infinity;
          if(bv===null||bv===undefined) bv=-Infinity;
          if(typeof av==='string'){ av=av.toLowerCase(); bv=String(bv||'').toLowerCase(); }
          if(av<bv) return state.sortDir==='asc'?-1:1;
          if(av>bv) return state.sortDir==='asc'?1:-1;
          return 0;
        });
      }
    }
    return out;
  }

  function render(){
    var list=filtered();
    var total=list.length;
    var pages=Math.max(1,Math.ceil(total/state.perPage));
    if(state.page>pages) state.page=pages;
    var slice=opts.noPaging?list:list.slice((state.page-1)*state.perPage, state.page*state.perPage);

    var head='<thead><tr>'+columns.map(function(c){
      var sortable=c.sort!==false;
      var sorted=state.sortKey===c.key;
      var arrow=sortable?('<span class="arrow">'+(sorted?(state.sortDir==='asc'?'&uarr;':'&darr;'):'&udarr;')+'</span>'):'';
      return '<th class="'+(c.num?'num ':'')+(sortable?'':'nosort ')+(sorted?'sorted':'')+'"'+
        (sortable?' data-key="'+c.key+'"':'')+'>'+esc(c.label)+arrow+'</th>';
    }).join('')+'</tr></thead>';

    var body='<tbody>'+(slice.length?slice.map(function(r,i){
      var rowCls=opts.rowClass?opts.rowClass(r):'';
      return '<tr'+(rowCls?' class="'+rowCls+'"':'')+'>'+columns.map(function(c){
        var cls=typeof c.cls==='function'?c.cls(r):(c.cls||'');
        var idx=(state.page-1)*state.perPage+i;
        return '<td class="'+(c.num?'num ':'')+cls+'">'+c.render(r,idx)+'</td>';
      }).join('')+'</tr>';
    }).join(''):'<tr class="empty-row"><td colspan="'+columns.length+'">'+
      esc(opts.emptyText||'Tidak ada data yang cocok.')+'</td></tr>')+'</tbody>';

    var foot='';
    if(opts.showFoot && list.length){
      foot='<tfoot><tr>'+columns.map(function(c){
        var v=c.foot?c.foot(list):'';
        return '<td class="'+(c.num?'num':'')+'">'+v+'</td>';
      }).join('')+'</tr></tfoot>';
    }

    var pager='';
    if(!opts.noPaging && total>state.perPage){
      var btns='';
      var from=Math.max(1,state.page-2), to=Math.min(pages,from+4);
      from=Math.max(1,to-4);
      if(from>1) btns+='<button data-pg="1">1</button>'+(from>2?'<span style="color:var(--text-faint)">…</span>':'');
      for(var p=from;p<=to;p++) btns+='<button data-pg="'+p+'" class="'+(p===state.page?'on':'')+'">'+p+'</button>';
      if(to<pages) btns+=(to<pages-1?'<span style="color:var(--text-faint)">…</span>':'')+'<button data-pg="'+pages+'">'+pages+'</button>';
      pager='<div class="pager"><span class="pinfo">'+
        ((state.page-1)*state.perPage+1)+'–'+Math.min(state.page*state.perPage,total)+' dari '+total+'</span>'+
        '<button data-pg="'+(state.page-1)+'" '+(state.page===1?'disabled':'')+'>&lsaquo;</button>'+
        btns+
        '<button data-pg="'+(state.page+1)+'" '+(state.page===pages?'disabled':'')+'>&rsaquo;</button></div>';
    }

    mount.innerHTML='<div class="table-scroll"><table class="dtab">'+head+body+foot+'</table></div>'+pager;

    mount.querySelectorAll('th[data-key]').forEach(function(th){
      th.onclick=function(){
        var k=th.getAttribute('data-key');
        if(state.sortKey===k) state.sortDir=state.sortDir==='asc'?'desc':'asc';
        else { state.sortKey=k; state.sortDir='desc'; }
        render();
      };
    });
    mount.querySelectorAll('.pager button[data-pg]').forEach(function(b){
      b.onclick=function(){ state.page=parseInt(b.getAttribute('data-pg')); render(); };
    });
    if(opts.countId){
      var ce=document.getElementById(opts.countId);
      if(ce) ce.textContent=total+' dari '+rows.length+' data';
    }
    if(opts.onRender) opts.onRender(list, mount);
  }

  render();
  return {
    render:render,
    setSearch:function(v){ state.search=v; state.page=1; render(); },
    setRows:function(r){ rows=r; state.page=1; render(); },
    getFiltered:filtered
  };
}

/* Map a cash/bank account name ("Kas Besar") to its full COA label ("1.1.1-Kas Besar"). */
var _kasLabelCache=null;
function kasAkunLabel(nama){
  if(!_kasLabelCache){
    _kasLabelCache={};
    DB.coa.forEach(function(a){ _kasLabelCache[a.nama.trim().toLowerCase()]=a.kode+'-'+a.nama; });
  }
  return _kasLabelCache[String(nama||'').trim().toLowerCase()] || nama;
}

/* Unified double-entry ledger.
   IMPORTANT: in the source cash/bank sheets, the Debet/Kredit columns describe the movement of the
   CASH account, while the "Nama Akun" column holds the counter account. So a cash payment sits in
   Kredit even though the expense account it belongs to must be DEBITED. Each cash transaction is
   therefore expanded into two legs, with the counter leg's sign flipped, which keeps the ledger
   balanced and makes revenue/expense signs come out correctly in the statements.
   Journal entries already store Debet/Kredit against their own named account, so they pass through. */
function allEntries(){
  var out=[];
  DB.txns.forEach(function(t){
    var base={tgl:t.tgl, ref:t.ref, akunKas:t.akunKas, project:t.project,
      relasi:t.relasi, kategori:t.kategori, ket:t.ket, src:'kas'};
    // leg 1 — the cash / bank account itself
    out.push(Object.assign({}, base, {akun:kasAkunLabel(t.akunKas), debet:t.debet, kredit:t.kredit, leg:'kas'}));
    /* leg 2 — the counter account (sign inverted). A handful of source rows have an empty
       "Nama Akun" cell; they are posted to a suspense account instead of being dropped, so the
       ledger still balances and the unclassified amount stays visible in the reports. */
    out.push(Object.assign({}, base, {
      akun: t.akunLawan || SUSPENSE_AKUN,
      debet:t.kredit, kredit:t.debet, leg:'lawan'
    }));
  });
  DB.jurnal.forEach(function(j){
    out.push({tgl:j.tgl, ref:j.ref, akun:j.akun, akunKas:'—', project:j.project,
      relasi:j.relasi, kategori:j.kategori, ket:j.ket, debet:j.debet, kredit:j.kredit, src:'jurnal', leg:'jurnal'});
  });
  return out;
}

      exportBtns('exp')) +
      '<div class="panel">'+
        '<div class="toolbar">'+
          '<div class="search-box"><span class="ic">⌕</span><input type="text" id="q" placeholder="Cari…"></div>'+
          '<span class="result-count" id="cnt"></span>'+
        '</div>'+
        '<div id="tbl"></div>'+
      '</div>';

    var cols=[{key:'_no', label:'No', sort:false, render:function(r,i){ return '<span class="no">'+(i+1)+'</span>'; }}]
      .concat(cfg.columns)
      .concat([{key:'_act', label:'Aksi', sort:false, render:function(r){
        return '<div class="btn-row">'+
          '<button class="btn btn-warn btn-sm" data-edit="'+r.id+'">Edit</button>'+
          '<button class="btn btn-danger btn-sm" data-del="'+r.id+'">Hapus</button></div>';
      }}]);

    var tbl;
    function refresh(){
      tbl=DataTable('tbl', cols, DB[cfg.coll], {
        searchFn:cfg.searchFn, countId:'cnt', perPage:15,
        onRender:function(){
          document.querySelectorAll('[data-edit]').forEach(function(b){
            b.onclick=function(){ form(b.getAttribute('data-edit')); };
          });
          document.querySelectorAll('[data-del]').forEach(function(b){
            b.onclick=function(){ del(b.getAttribute('data-del')); };
          });
        }
      });
      bindSearch('q', tbl);
    }

    function form(id){
      var rec=id?DB[cfg.coll].find(function(x){ return x.id===id; }):null;
      var html='<div class="form-grid">'+cfg.fields.map(function(f){
        var val=rec?(rec[f.key]!==undefined?rec[f.key]:''):'';
        if(f.type==='select'){
          return '<div class="field'+(f.width==='full'?' full':'')+'"><label>'+esc(f.label)+'</label>'+
            '<select id="f_'+f.key+'">'+f.options.map(function(o){
              return '<option value="'+esc(o)+'"'+(String(val)===o?' selected':'')+'>'+esc(o)+'</option>';
            }).join('')+'</select></div>';
        }
        if(f.type==='combo'){
          return '<div class="field'+(f.width==='full'?' full':'')+'"><label>'+esc(f.label)+'</label>'+
            '<div id="f_'+f.key+'_ssel"></div><input type="hidden" id="f_'+f.key+'" value="'+esc(val)+'"></div>';
        }
        return '<div class="field'+(f.width==='full'?' full':'')+'"><label>'+esc(f.label)+
          (f.required?' *':'')+'</label><input id="f_'+f.key+'" type="'+(f.type||'text')+'" value="'+esc(val)+'"></div>';
      }).join('')+'</div>';

      openModal((id?'Edit ':'Tambah ')+cfg.title.replace(/^(Data|Master)\s+/i,''), html, {onSave:function(){
        var obj=id?rec:{id:uid(cfg.coll[0])};
        for(var i=0;i<cfg.fields.length;i++){
          var f=cfg.fields[i];
          var v=fv('f_'+f.key);
          if(f.required && !v){ toast('Kolom "'+f.label+'" wajib diisi.','danger'); return; }
          obj[f.key]=(f.type==='number')?(parseFloat(v.replace(/[^\d.-]/g,''))||0):v;
        }
        if(!id) DB[cfg.coll].push(obj);
        saveDB(); syncUpsert(cfg.coll, obj); closeModal(); refresh();
        toast(id?'Data berhasil diperbarui.':'Data baru ditambahkan.','success');
      }});
      cfg.fields.forEach(function(f){
        if(f.type!=='combo') return;
        searchableSelect('f_'+f.key+'_ssel','f_'+f.key,{
          options:f.options.map(function(o){ return {value:o,label:o}; }),
          allowCustom:true, placeholder:'Pilih atau ketik '+f.label.toLowerCase()+'…'});
      });
    }

    function del(id){
      var rec=DB[cfg.coll].find(function(x){ return x.id===id; });
      confirmModal('Hapus data', 'Yakin mau menghapus <b>'+esc(rec[cfg.nameKey||'nama'])+'</b>? Tindakan ini tidak bisa dibatalkan.', function(){
        DB[cfg.coll]=DB[cfg.coll].filter(function(x){ return x.id!==id; });
        saveDB(); syncDelete(cfg.coll, id); refresh(); toast('Data dihapus.','success');
      });
    }

    refresh();
    document.getElementById('btnAdd').onclick=function(){ form(null); };
    bindExport('exp', cfg.title.replace(/\s+/g,'_'),
      cfg.fields.map(function(f){ return f.label; }),
      function(){ return tbl.getFiltered().map(function(r){
        return cfg.fields.map(function(f){ return r[f.key]; }); }); });
  };
}

/* ------------------------------------------------------------
   FINANCE TRANSACTION PAGE (kas/bank masuk/keluar)
   ------------------------------------------------------------ */
function financePage(jenis, title, sub){
  return function(c){
    var isIn=/masuk$/.test(jenis);
    var isBank=/^bank/.test(jenis);

    var kasAkun=DB.coa.filter(function(a){
      return isBank ? /^1\.1\.[3-7]$/.test(a.kode) : /^1\.1\.[12]$/.test(a.kode);
    }).map(function(a){ return a.nama; });
    if(!kasAkun.length) kasAkun=isBank?['Bank BCA','Bank BJB','Bank BRI','Bank BNI','Bank MANDIRI']:['Kas Besar','Kas Kecil'];

    c.innerHTML = pageHead(title, sub,
      '<button class="btn btn-primary" id="btnAdd">+ Tambah Data</button>'+exportBtns('exp')) +
      '<div class="filterbar">'+
        '<div class="field"><label>Dari Tanggal</label><input type="date" id="fFrom"></div>'+
        '<div class="field"><label>Sampai Tanggal</label><input type="date" id="fTo"></div>'+
        '<div class="field"><label>Akun '+(isBank?'Bank':'Kas')+'</label><select id="fAkun">'+
          '<option value="">Semua</option>'+kasAkun.map(function(a){ return '<option>'+esc(a)+'</option>'; }).join('')+
        '</select></div>'+
        '<div class="field grow"><label>Project</label><select id="fProject"><option value="">Semua</option>'+
          DB.projects.map(function(p){ return '<option>'+esc(p.nama)+'</option>'; }).join('')+'</select></div>'+
        '<button class="btn btn-steel" id="btnFilter">Terapkan Filter</button>'+
        '<button class="btn btn-ghost" id="btnReset">Reset</button>'+
      '</div>'+
      '<div class="kpi-grid" id="kpi" style="margin-bottom:14px;"></div>'+
      '<div class="panel">'+
        '<div class="toolbar">'+
          '<div class="search-box"><span class="ic">⌕</span><input type="text" id="q" placeholder="Cari keterangan / project / ref…"></div>'+
          '<span class="result-count" id="cnt"></span>'+
        '</div>'+
        '<div id="tbl"></div>'+
      '</div>';

    var cols=[
      {key:'_no', label:'No', sort:false, render:function(r,i){ return '<span class="no">'+(i+1)+'</span>'; }},
      {key:'tgl', label:'Tanggal', render:function(r){ return fmtDate(r.tgl); }},
      {key:'ref', label:'Ref No', render:function(r){ return '<span class="mono" style="font-size:11.5px;">'+esc(r.ref)+'</span>'; }},
      {key:'akunKas', label:'Akun '+(isBank?'Bank':'Kas'), render:function(r){ return esc(r.akunKas); }},
      {key:'akunLawan', label:'Akun Lawan', render:function(r){ return esc(r.akunLawan||'–'); }},
      {key:'project', label:'Project', render:function(r){ return esc(r.project||'–'); }},
      {key:'relasi', label:'Relasi', render:function(r){ return r.relasi?esc(r.relasi):'<span class="faint-italic">–</span>'; }},
      {key:'amount', label:'Amount', num:true, sortVal:function(r){ return isIn?r.debet:r.kredit; },
       render:function(r){ return '<b class="'+(isIn?'pos':'')+'">'+num0(isIn?r.debet:r.kredit)+'</b>'; },
       foot:function(list){ return '<b>'+num0(list.reduce(function(a,b){ return a+(isIn?b.debet:b.kredit); },0))+'</b>'; }},
      {key:'ket', label:'Description', cls:'wrap', render:function(r){ return esc(r.ket||'–'); }},
      {key:'_act', label:'Action', sort:false, render:function(r){
        return '<div class="btn-row"><button class="btn btn-warn btn-sm" data-edit="'+r.id+'">Edit</button>'+
          '<button class="btn btn-danger btn-sm" data-del="'+r.id+'">Hapus</button></div>';
      }}
    ];

    var tbl;
    function currentRows(){
      var from=fv('fFrom'), to=fv('fTo'), ak=fv('fAkun'), pj=fv('fProject');
      return DB.txns.filter(function(t){
        if(t.jenis!==jenis) return false;
        if(!inRange(t.tgl, from, to)) return false;
        if(ak && t.akunKas!==ak) return false;
        if(pj && t.project!==pj) return false;
        return true;
      }).sort(function(a,b){ return a.tgl<b.tgl?1:-1; });
    }

    function refresh(){
      var rows=currentRows();
      var total=rows.reduce(function(a,b){ return a+(isIn?b.debet:b.kredit); },0);
      var projSet={}; rows.forEach(function(r){ if(r.project) projSet[r.project]=1; });
      document.getElementById('kpi').innerHTML=[
        kpiCard('Jumlah Transaksi', num0(rows.length), 'Sesuai filter aktif', 'accent'),
        kpiCard('Total '+(isIn?'Pemasukan':'Pengeluaran'), rp(total), 'Sesuai filter aktif', isIn?'safe':'accent'),
        kpiCard('Project Terlibat', num0(Object.keys(projSet).length), 'Project berbeda', 'accent')
      ].join('');

      tbl=DataTable('tbl', cols, rows, {
        searchFn:function(r){ return [r.ket,r.project,r.ref,r.relasi,r.akunLawan].join(' '); },
        countId:'cnt', perPage:15, showFoot:true, defaultSort:'tgl', defaultDir:'desc',
        emptyText:'Belum ada transaksi pada rentang filter ini.',
        onRender:function(){
          document.querySelectorAll('[data-edit]').forEach(function(b){ b.onclick=function(){ form(b.getAttribute('data-edit')); }; });
          document.querySelectorAll('[data-del]').forEach(function(b){ b.onclick=function(){ del(b.getAttribute('data-del')); }; });
        }
      });
      bindSearch('q', tbl);
    }

    function form(id){
      var rec=id?DB.txns.find(function(x){ return x.id===id; }):null;
      var lawanOpts=DB.coa.filter(function(a){ return a.level>=3; })
        .map(function(a){ return a.kode+'-'+a.nama; });
      var relasiList=isIn?DB.customers:DB.vendors;
      var relasiOpts=[''].concat(relasiList.map(function(r){ return r.nama; }));
      var relasiLabel=isIn?'Customer':'Vendor';
      var v=function(k,d){ return rec?(rec[k]!==undefined?rec[k]:d):d; };
      var amount=rec?(isIn?rec.debet:rec.kredit):'';

      var html='<div class="form-grid">'+
        '<div class="field"><label>Tanggal *</label><input type="date" id="f_tgl" value="'+esc(v('tgl',todayISO()))+'"></div>'+
        '<div class="field"><label>Akun '+(isBank?'Bank':'Kas')+' *</label>'+
          '<div id="f_akunKas_ssel"></div><input type="hidden" id="f_akunKas" value="'+esc(v('akunKas',''))+'"></div>'+
        '<div class="field full"><label>Akun Lawan *</label>'+
          '<div id="f_akunLawan_ssel"></div><input type="hidden" id="f_akunLawan" value="'+esc(v('akunLawan',''))+'"></div>'+
        '<div class="field"><label>Project</label>'+
          '<div id="f_project_ssel"></div><input type="hidden" id="f_project" value="'+esc(v('project',''))+'"></div>'+
        '<div class="field"><label>'+relasiLabel+'</label>'+
          '<div id="f_relasi_ssel"></div><input type="hidden" id="f_relasi" value="'+esc(v('relasi',''))+'"></div>'+
        '<div class="field"><label>Amount (Rp) *</label><input type="number" id="f_amount" value="'+esc(amount)+'"></div>'+
        '<div class="field full"><label>Description</label><input type="text" id="f_ket" value="'+esc(v('ket',''))+'"></div>'+
      '</div>';

      openModal((id?'Edit ':'Tambah ')+title, html, {wide:true, onSave:function(){
        var tgl=fv('f_tgl'), amt=fnum('f_amount');
        if(!tgl){ toast('Tanggal wajib diisi.','danger'); return; }
        if(!amt || amt<=0){ toast('Amount harus lebih besar dari 0.','danger'); return; }
        var obj=rec||{id:uid('t'), jenis:jenis};
        obj.tgl=tgl;
        obj.akunKas=fv('f_akunKas');
        obj.akunLawan=fv('f_akunLawan');
        obj.project=fv('f_project');
        obj.relasi=fv('f_relasi')==='–'?'':fv('f_relasi');
        var relasiRec=relasiList.find(function(r){ return r.nama===obj.relasi; });
        obj.customerId=isIn?(relasiRec?relasiRec.id:null):null;
        obj.vendorId=!isIn?(relasiRec?relasiRec.id:null):null;
        obj.ket=fv('f_ket');
        obj.debet=isIn?amt:0;
        obj.kredit=isIn?0:amt;
        if(!id){
          var pref=(isBank?(isIn?'BI':'BO'):(isIn?'CI':'CO'));
          obj.ref=pref+'-'+tgl.slice(2,4)+tgl.slice(5,7)+'-'+String(DB.txns.length+1).padStart(4,'0');
          DB.txns.push(obj);
        }
        saveDB(); syncUpsert('transactions', obj); closeModal(); refresh();
        toast(id?'Transaksi diperbarui.':'Transaksi ditambahkan.','success');
      }});
      searchableSelect('f_akunKas_ssel','f_akunKas',{options:kasAkun.map(function(a){ return {value:a,label:a}; }),
        placeholder:'Cari akun '+(isBank?'bank':'kas')+'…'});
      searchableSelect('f_akunLawan_ssel','f_akunLawan',{options:lawanOpts.map(function(a){ return {value:a,label:a}; }),
        placeholder:'Cari kode / nama akun…'});
      searchableSelect('f_project_ssel','f_project',{options:DB.projects.map(function(p){ return {value:p.nama,label:p.nama}; }),
        placeholder:'Cari project…'});
      searchableSelect('f_relasi_ssel','f_relasi',{options:relasiList.map(function(r){ return {value:r.nama,label:r.nama}; }),
        placeholder:'Cari '+relasiLabel.toLowerCase()+'…'});
    }

    function del(id){
      var rec=DB.txns.find(function(x){ return x.id===id; });
      confirmModal('Hapus transaksi','Hapus transaksi <b>'+esc(rec.ref)+'</b> senilai <b>'+rp(isIn?rec.debet:rec.kredit)+'</b>?',function(){
        DB.txns=DB.txns.filter(function(x){ return x.id!==id; });
        saveDB(); syncDelete('transactions', id); refresh(); toast('Transaksi dihapus.','success');
      });
    }

    refresh();
    document.getElementById('btnAdd').onclick=function(){ form(null); };
    document.getElementById('btnFilter').onclick=refresh;
    document.getElementById('btnReset').onclick=function(){
      ['fFrom','fTo','fAkun','fProject'].forEach(function(i){ document.getElementById(i).value=''; });
      refresh();
    };
    bindExport('exp', title.replace(/\s+/g,'_'),
      ['Tanggal','Ref No','Akun','Akun Lawan','Project','Relasi','Amount','Description'],
      function(){ return tbl.getFiltered().map(function(r){
        return [r.tgl,r.ref,r.akunKas,r.akunLawan,r.project,r.relasi,(isIn?r.debet:r.kredit),r.ket]; }); });
  };
}

        '<span class="desc">Hanya proyek yang sudah dilaporkan admin</span></div>'+
      '<div class="panel tick" id="dualWrap"></div>'+
      '<div class="section-head"><h2><span class="icon-chip">☰</span>Rincian Progress per Proyek</h2>'+
        '<span class="desc">Klik header kolom untuk mengurutkan</span></div>'+
      '<div class="panel"><div class="toolbar">'+
        '<div class="search-box"><span class="ic">⌕</span><input type="text" id="qProg" placeholder="Cari proyek…"></div>'+
        '<div class="field" style="min-width:200px;"><label style="font-size:11px;">Pemberi Proyek</label>'+

        '<span class="result-count" id="cntProg"></span></div>'+
        '<div class="table-scroll"><div id="tblProg"></div></div></div>';

    /* --- period logic --- */
    var curId=SEED.periods[SEED.periods.length-1].id;
    function period(){ return SEED.periods.find(function(p){ return p.id===curId; }); }

    function drawPeriodSel(){
      var el=document.getElementById('periodSel');
      el.innerHTML=SEED.periods.map(function(p,i){
        var tag=i===SEED.periods.length-1?'Minggu terbaru':(i===SEED.periods.length-2?'Minggu sebelumnya':'Minggu lalu');
        return '<button class="seg-btn'+(p.id===curId?' on':'')+'" data-pid="'+p.id+'">'+esc(p.short)+
          '<span class="seg-sub">'+tag+'</span></button>';
      }).join('');
      el.querySelectorAll('.seg-btn').forEach(function(b){
        b.onclick=function(){
          curId=b.getAttribute('data-pid');
          el.querySelectorAll('.seg-btn').forEach(function(x){ x.classList.remove('on'); });
          b.classList.add('on');
          drawKas(); drawKum();
        };
      });
    }

    var kasTbl=null;
    function drawKas(){
      var p=period();
      document.getElementById('periodNote').textContent='Menampilkan data '+p.label;
      var cards=[];
      if(p.saldo_awal) cards.push(kpiCard('Saldo Awal / Dana Tersedia', rp(p.saldo_awal),'Posisi kas di awal periode','accent'));
      cards.push(kpiCard('Uang Masuk', rp(p.uang_masuk), p.label,'accent'));
      cards.push(kpiCard('Uang Keluar', rp(p.uang_keluar), p.label,'accent'));
      cards.push(kpiCard('Saldo Akhir', rp(p.saldo_akhir),
        p.saldo_akhir<0?'Defisit — uang keluar melebihi masuk':'Surplus periode ini',
        p.saldo_akhir<0?'danger':'safe'));
      document.getElementById('kpiKas').innerHTML=cards.join('');

  PAGES.coa=function(c){
    c.innerHTML = pageHead('Data COA','Chart of Account — struktur akun perusahaan',
      '<button class="btn btn-primary" id="btnAdd">+ Tambah Akun</button>'+
      '<button class="btn btn-ghost btn-sm" id="btnExpand">Buka Semua</button>'+
      '<button class="btn btn-ghost btn-sm" id="btnCollapse">Tutup Semua</button>'+
      exportBtns('exp'))+
      '<div class="panel" style="padding:0;">'+
        '<div style="padding:14px 16px;border-bottom:1px solid var(--line);">'+
          '<div class="search-box" style="max-width:340px;"><span class="ic">⌕</span>'+
          '<input type="text" id="q" placeholder="Cari kode / nama akun…"></div></div>'+
        '<div id="coaList"></div>'+
      '</div>';

    var collapsed={};
    function draw(){
      var q=fv('q').toLowerCase();
      var list=DB.coa.slice().sort(function(a,b){
        return a.kode.split('.').map(function(n){return String(n).padStart(4,'0');}).join('.')
             > b.kode.split('.').map(function(n){return String(n).padStart(4,'0');}).join('.') ? 1 : -1;
      });
      var html=list.map(function(a){
        var hide=false;
        if(!q){
          var parts=a.kode.split('.');
          for(var i=1;i<parts.length;i++){
            if(collapsed[parts.slice(0,i).join('.')]){ hide=true; break; }
          }
        } else {
          hide = (a.kode+' '+a.nama).toLowerCase().indexOf(q)===-1;
        }
        var hasChild=list.some(function(x){ return x.kode!==a.kode && x.kode.indexOf(a.kode+'.')===0; });
        var pad=(a.level-1)*20;
        return '<div class="coa-row lv'+a.level+(hide?' hide':'')+'" style="padding-left:'+(14+pad)+'px;">'+
          '<span class="toggle" data-tg="'+esc(a.kode)+'">'+(hasChild?(collapsed[a.kode]?'▸':'▾'):'')+'</span>'+
          '<span class="kode">'+esc(a.kode)+'</span>'+
          '<span class="nm">'+esc(a.nama)+' <span class="tipe">('+esc(a.tipe)+')</span></span>'+
          '<span class="acts"><button class="btn btn-warn btn-sm" data-edit="'+a.id+'">Edit</button>'+
          '<button class="btn btn-danger btn-sm" data-del="'+a.id+'">Hapus</button></span></div>';
      }).join('');
      document.getElementById('coaList').innerHTML=html;

      document.querySelectorAll('[data-tg]').forEach(function(t){
        t.onclick=function(){
          var k=t.getAttribute('data-tg');
          collapsed[k]=!collapsed[k]; draw();
        };
      });
      document.querySelectorAll('#coaList [data-edit]').forEach(function(b){
        b.onclick=function(){ form(b.getAttribute('data-edit')); };
      });
      document.querySelectorAll('#coaList [data-del]').forEach(function(b){
        b.onclick=function(){ del(b.getAttribute('data-del')); };
      });
    }
    function form(id){
      var rec=id?DB.coa.find(function(x){ return x.id===id; }):null;
      openModal((id?'Edit':'Tambah')+' Akun',
        '<div class="form-grid">'+
        '<div class="field"><label>Kode Akun *</label><input id="f_kode" value="'+esc(rec?rec.kode:'')+'" placeholder="mis. 6.2.40"></div>'+
        '<div class="field"><label>Nama Akun *</label><input id="f_nama" value="'+esc(rec?rec.nama:'')+'"></div>'+
        '</div>',{onSave:function(){
          var kode=fv('f_kode'), nama=fv('f_nama');
          if(!kode||!nama){ toast('Kode dan nama akun wajib diisi.','danger'); return; }
          if(!/^\d+(\.\d+)*$/.test(kode)){ toast('Format kode akun tidak valid (contoh: 6.2.40).','danger'); return; }
          var dup=DB.coa.find(function(x){ return x.kode===kode && (!rec||x.id!==rec.id); });
          if(dup){ toast('Kode akun '+kode+' sudah dipakai.','danger'); return; }
          var savedObj;
          if(rec){ rec.kode=kode; rec.nama=nama; rec.level=kode.split('.').length; rec.tipe=coaTipe(kode); savedObj=rec; }
          else { savedObj={id:uid('a'),kode:kode,nama:nama,level:kode.split('.').length,tipe:coaTipe(kode)}; DB.coa.push(savedObj); }
          saveDB(); syncUpsert('coa', savedObj); closeModal(); draw(); toast('Akun tersimpan.','success');
        }});
    }
    function del(id){
      var rec=DB.coa.find(function(x){ return x.id===id; });
      var kids=DB.coa.filter(function(x){ return x.kode.indexOf(rec.kode+'.')===0; });
      confirmModal('Hapus akun','Hapus akun <b>'+esc(rec.kode+' — '+rec.nama)+'</b>?'+
        (kids.length?' Akun ini punya <b>'+kids.length+' sub-akun</b> yang ikut terhapus.':''),function(){
        var removedIds=[id].concat(kids.map(function(x){ return x.id; }));
        DB.coa=DB.coa.filter(function(x){ return x.id!==id && x.kode.indexOf(rec.kode+'.')!==0; });
        saveDB(); removedIds.forEach(function(rid){ syncDelete('coa', rid); }); draw(); toast('Akun dihapus.','success');
      });
    }
    draw();
    document.getElementById('q').addEventListener('input',draw);
    document.getElementById('btnAdd').onclick=function(){ form(null); };
    document.getElementById('btnExpand').onclick=function(){ collapsed={}; draw(); };
    document.getElementById('btnCollapse').onclick=function(){
      DB.coa.forEach(function(a){ if(a.level<=2) collapsed[a.kode]=true; }); draw();
    };
    bindExport('exp','Chart_of_Account',['Kode','Nama Akun','Tipe'],function(){
      return DB.coa.map(function(a){ return [a.kode,a.nama,a.tipe]; });
    });
  };

  function relasiReport(cfg){
    return function(c){
      reportShell(c, cfg.title, cfg.sub,
        '<div class="field grow"><label>'+cfg.filterLabel+'</label><select id="fRel"><option value="">Semua</option>'+
        cfg.list().map(function(r){ return '<option>'+esc(r.nama)+'</option>'; }).join('')+'</select></div>');

      var tbl;
      function refresh(){
        var from=fv('fFrom'), to=fv('fTo'), rel=fv('fRel');
        var ent=allEntries().filter(cfg.match);
        var map={};
        ent.forEach(function(e){
          var key=e.relasi||'(Tanpa Relasi)';
          if(rel && key!==rel) return;
          if(!map[key]) map[key]={nama:key, awal:0, mutasi:0};
          var val=cfg.sign(e);
          if(from && e.tgl<from) map[key].awal+=val;
          else if(inRange(e.tgl,from,to)) map[key].mutasi+=val;
        });
        var rows=Object.keys(map).map(function(k){
          var r=map[k]; r.total=r.awal+r.mutasi; return r;
        }).filter(function(r){ return r.awal||r.mutasi||r.total; })
          .sort(function(a,b){ return Math.abs(b.total)-Math.abs(a.total); });

        var totalAll=rows.reduce(function(a,b){ return a+b.total; },0);
        document.getElementById('reportBody').innerHTML=
          '<div class="kpi-grid" style="margin-bottom:14px;">'+
            kpiCard(cfg.kpiLabel, rp(totalAll), rows.length+' '+cfg.unit, totalAll<0?'danger':'accent')+
            kpiCard('Jumlah '+cfg.unitCap, num0(rows.length),'Punya saldo berjalan','accent')+
          '</div>'+
          '<div class="panel"><div class="toolbar">'+
            '<div class="search-box"><span class="ic">⌕</span><input type="text" id="q" placeholder="Cari…"></div>'+
            '<span class="result-count" id="cnt"></span></div><div id="tbl"></div></div>';

        tbl=DataTable('tbl',[
          {key:'_no',label:'No',sort:false,render:function(r,i){ return '<span class="no">'+(i+1)+'</span>'; }},
          {key:'nama',label:cfg.colName,render:function(r){ return '<b>'+esc(r.nama)+'</b>'; }},
          {key:'awal',label:'Saldo Awal',num:true,render:function(r){ return numSigned(r.awal); },
           foot:function(l){ return '<b>'+numSigned(l.reduce(function(a,b){return a+b.awal;},0))+'</b>'; }},
          {key:'mutasi',label:'Mutasi',num:true,render:function(r){ return numSigned(r.mutasi); },
           foot:function(l){ return '<b>'+numSigned(l.reduce(function(a,b){return a+b.mutasi;},0))+'</b>'; }},
          {key:'total',label:'Total',num:true,render:function(r){
            return '<b class="'+(r.total<0?'neg':'')+'">'+numSigned(r.total)+'</b>'; },
           foot:function(l){ return '<b>'+numSigned(l.reduce(function(a,b){return a+b.total;},0))+'</b>'; }}
        ], rows, {defaultSort:'total',defaultDir:'desc',perPage:20,showFoot:true,countId:'cnt',
          searchFn:function(r){ return r.nama; },
          emptyText:'Tidak ada saldo pada rentang ini.'});
        bindSearch('q',tbl);
      }
      refresh();
      bindReportFilter(refresh,['fRel']);
      bindExport('exp',cfg.title.replace(/\s+/g,'_'),[cfg.colName,'Saldo Awal','Mutasi','Total'],
        function(){ return tbl.getFiltered().map(function(r){ return [r.nama,r.awal,r.mutasi,r.total]; }); });
    };
  }
